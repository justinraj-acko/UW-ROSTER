/* ---------- roster tab ---------- */
function monthDayTypes(month) {
  const info = monthInfo(month);
  const holOn = S.rules.some(r => r.enabled && r.type === 'holiday_off');
  const hols = {};
  S.holidays.filter(h => h.date.slice(0, 7) === month).forEach(h => { hols[+h.date.slice(8, 10) - 1] = h.name; });
  const Cs = TEAMS.map(t => {
    const N = S.resources.filter(r => r.team === t).length;
    return { N, C: compileRules(S.rules, t, Math.max(N, 1), info.D, info.dows) };
  });
  const types = [];
  for (let d = 0; d < info.D; d++) {
    if (holOn && hols[d] !== undefined) types.push('hol');
    else if (Cs.some(x => x.C.locked[d])) types.push('full');
    else if (Cs.some(x => x.C.req[d] > 0)) types.push('min');
    else types.push('open');
  }
  return { info, types, hols, Cs };
}

function viewRoster() {
  const m = S.ui.month;
  const info = monthInfo(m);
  const hols = S.holidays.filter(h => h.date.slice(0, 7) === m);
  const lvs = S.leaves.filter(l => !(l.to < info.first || l.from > info.last) && currentRes(l.resId));
  const work = S.ui.work[m];
  const steps = [
    { n: 1, label: 'Month', sub: monthLabel(m) },
    { n: 2, label: 'Public holidays', sub: hols.length ? plural(hols.length, 'holiday') : 'None added' },
    { n: 3, label: 'Planned leave', sub: lvs.length ? plural(lvs.length, 'entry', 'entries') : 'None added' },
    { n: 4, label: 'Roster', sub: work ? (work.savedAt && !work.dirty ? 'Saved' : 'Not saved yet') : (S.saved[m] ? 'Saved' : 'Not generated') },
  ];
  let html = '<ol class="steps" aria-label="Roster steps">' + steps.map(s =>
    '<li><button class="step' + (s.n < S.ui.step ? ' done' : '') + '" data-act="step" data-step="' + s.n + '"' + (s.n === S.ui.step ? ' aria-current="step"' : '') + '>' +
    '<span class="step-n">' + (s.n < S.ui.step ? '✓' : s.n) + '</span><span class="step-text"><span class="step-label">' + s.label + '</span><span class="step-sub">' + esc(s.sub) + '</span></span></button></li>').join('') + '</ol>';
  if (S.ui.step === 1) html += viewMonthStep();
  else if (S.ui.step === 2) html += viewHolidayStep(hols);
  else if (S.ui.step === 3) html += viewLeaveStep(lvs);
  else html += viewRosterStep();
  return html;
}

function viewMonthStep() {
  const m = S.ui.month;
  const { info, types, Cs } = monthDayTypes(m);
  const { y, mo } = { y: info.y, mo: info.m };
  const firstDow = info.dows[0];
  const lead = (firstDow + 6) % 7;
  let cal = '<div class="cal" aria-hidden="true">' + ['Mo', 'Tu', 'We', 'Th', 'Fr', 'Sa', 'Su'].map(d => '<div class="cal-h">' + d + '</div>').join('');
  for (let i = 0; i < lead; i++) cal += '<div class="cal-d blank"></div>';
  for (let d = 0; d < info.D; d++) cal += '<div class="cal-d t-' + types[d] + '">' + (d + 1) + '</div>';
  cal += '</div>';
  const full = types.filter(t => t === 'full').length, min = types.filter(t => t === 'min').length, hol = types.filter(t => t === 'hol').length;
  const rm = S.resources.filter(r => r.team === 'RM').length, cmu = S.resources.filter(r => r.team === 'CMU').length;
  const cap = S.rules.filter(r => r.enabled && r.type === 'max_work').reduce((a, r) => Math.min(a, r.params.n), Infinity);
  const offsNeeded = isFinite(cap) ? Math.max(0, info.D - hol - cap) : null;
  const prevM = addMonths(m, -1);
  const lastType = types[info.D - 1];
  const minPcts = [...new Set(S.rules.filter(r => r.enabled && r.type === 'min_days').map(r => r.params.pct + '%'))];
  const fillRule = S.rules.find(r => r.enabled && r.type === 'min_days' && r.params.fill);
  const nExempt = new Set(S.rules.filter(r => r.enabled && RULE_TYPES[r.type].params.includes('except')).flatMap(r => (r.params.except || []).filter(id => currentRes(id)))).size;
  const offsPerDay = fillRule ? TEAMS.filter(t => (fillRule.params.teams || TEAMS).includes(t)).map(t => {
    const N = S.resources.filter(r => r.team === t).length;
    const k = N - Math.ceil(fillRule.params.pct * N / 100 - 1e-9);
    return k + ' ' + t;
  }) : [];
  const srList = 'Full-strength days: ' + types.map((t, d) => t === 'full' ? d + 1 : null).filter(Boolean).join(', ');
  return '<section class="panel">' +
    '<div class="month-hero">' +
    '<button class="icon-btn" data-act="month-shift" data-k="-1" aria-label="Previous month">‹</button>' +
    '<h2 class="month-name">' + MONTHS[mo] + ' <span class="yr">' + y + '</span></h2>' +
    '<button class="icon-btn" data-act="month-shift" data-k="1" aria-label="Next month">›</button>' +
    '<label class="field month-jump">Choose another month<input type="month" class="input" value="' + m + '" data-chg="month"></label>' +
    '</div>' +
    '<div class="month-body"><div>' + cal + '<p class="sr">' + esc(srList) + '</p>' +
    '<div class="cal-legend"><span><i class="sw full"></i>Full strength</span><span><i class="sw min"></i>' + (fillRule ? fillRule.params.pct + '% on duty, ' + (100 - fillRule.params.pct) + '% off' : 'Reduced minimum' + (minPcts.length ? ' (' + minPcts.join(', ') + ')' : '')) + '</span><span><i class="sw open"></i>Open</span><span><i class="sw hol"></i>Public holiday</span></div></div>' +
    '<div><dl class="facts">' +
    '<dt>' + info.D + '</dt><dd>days, every one a working day for both teams</dd>' +
    '<dt>' + full + '</dt><dd><strong>full-strength days</strong>, no week-offs allowed' + (nExempt ? ' except for ' + plural(nExempt, 'exempt doctor') : '') + (lastType === 'full' ? '. The last date, ' + DOW_LONG[info.dows[info.D - 1]] + ' ' + info.D + ', is one of them.' : '') + '</dd>' +
    (fillRule
      ? '<dt>' + min + '</dt><dd>days at <strong>' + fillRule.params.pct + '% on duty</strong>, where ' + joinList(offsPerDay) + ' doctor' + (offsPerDay.join('') === '1 CMU' ? '' : 's') + ' get a week-off each day</dd>'
      : '<dt>' + min + '</dt><dd>days with a <strong>reduced minimum</strong>, where a share of each team can be off</dd>') +
    '<dt>' + hol + '</dt><dd>' + (hol ? '<strong>public holiday' + (hol === 1 ? '' : 's') + '</strong> off for everyone' : 'public holidays added so far') + '</dd>' +
    (offsNeeded != null ? '<dt>' + offsNeeded + '</dt><dd>week-offs per doctor at least, to stay within ' + cap + ' working days</dd>' : '') +
    '<dt>' + (rm + cmu) + '</dt><dd>doctors: ' + rm + ' in RM, ' + cmu + ' in CMU</dd>' +
    '</dl>' +
    '<div class="note">' + (S.saved[prevM]
      ? 'Working streaks carry over from the saved ' + monthLabel(prevM) + ' roster, so nobody crosses the month boundary on a long run.'
      : 'There is no saved ' + monthLabel(prevM) + ' roster, so every doctor starts this month with a fresh streak. Save each month in History to carry streaks over.') +
    (S.saved[m] ? '<br><strong>A roster for ' + monthLabel(m) + ' is already saved.</strong> Generating again only replaces it when you save.' : '') + '</div>' +
    '</div></div>' +
    '<div class="step-actions"><span></span><button class="btn primary" data-act="step" data-step="2">Continue to public holidays</button></div>' +
    '</section>';
}

function viewHolidayStep(hols) {
  const m = S.ui.month;
  const info = monthInfo(m);
  const { types } = monthDayTypes(m);
  const holOn = S.rules.some(r => r.enabled && r.type === 'holiday_off');
  const lockedByRules = d => {
    const { Cs } = monthDayTypes(m);
    return Cs.some(x => x.C.locked[d]);
  };
  const list = hols.slice().sort((a, b) => (a.date < b.date ? -1 : 1));
  const taken = new Set(list.map(h => h.date));
  const sugg = FIXED_HOLIDAYS.map(f => ({ date: info.y + '-' + f.md, name: f.name })).filter(f => f.date.slice(0, 7) === m && !taken.has(f.date));
  let html = '<section class="panel">' + roBanner() +
    '<div class="panel-head"><div><h2>Public holidays in ' + monthLabel(m) + '</h2><p>Add every general or public holiday in this month from your HR holiday policy. ' +
    (holOn ? 'Both teams are fully off on these days, even when the day would otherwise need full strength.' : 'The public-holiday rule is switched off, so these days are treated as normal working days.') + '</p></div></div>';
  if (!list.length) html += '<div class="empty">No holidays added for ' + MONTHS[info.m] + ' yet. If there are none this month, continue to planned leave.</div>';
  else html += '<ul class="list">' + list.map(h => {
    const d = +h.date.slice(8, 10) - 1;
    const onFull = lockedByRules(d);
    return '<li class="list-item"><div class="date-badge"><b>' + (d + 1) + '</b><span>' + DOW_SHORT[info.dows[d]] + '</span></div>' +
      '<div class="list-main"><strong>' + esc(h.name) + '</strong><span class="sub">' + fmtDate(h.date) + '</span></div>' +
      (onFull ? '<span class="chip warn">Falls on a full-strength day; the holiday takes priority</span>' : '') +
      '<button class="icon-btn del" data-act="hol-del" data-id="' + esc(h.id) + '" aria-label="Remove ' + esc(h.name) + '"' + RO() + '>×</button></li>';
  }).join('') + '</ul>';
  html += '<div class="adder"><h3>Add a holiday</h3><div class="form-row">' +
    '<label class="field">Date<input type="date" class="input" id="hol-date" min="' + info.first + '" max="' + info.last + '" value="' + info.first + '"' + RO() + '></label>' +
    '<label class="field grow">Holiday name<input type="text" class="input" id="hol-name" placeholder="e.g. Diwali, Pongal, Ramzan"' + RO() + '></label>' +
    '<button class="btn primary" data-act="hol-add"' + RO() + '>Add holiday</button></div>';
  if (sugg.length) html += '<div class="sugg"><span class="small muted">Fixed-date holidays this month:</span>' + sugg.map(s =>
    '<button class="sugg-btn" data-act="hol-sugg" data-date="' + s.date + '" data-name="' + esc(s.name) + '"' + RO() + '>Add ' + esc(s.name) + ', ' + fmtDate(s.date) + '</button>').join('') + '</div>';
  html += '<p class="small muted" style="margin:12px 0 0">Festivals such as Pongal, Diwali, Ramzan and Good Friday move every year. Add them with the date from your HR calendar.</p></div>';
  html += '<div class="step-actions"><button class="btn" data-act="step" data-step="1">Back</button><button class="btn primary" data-act="step" data-step="3">Continue to planned leave</button></div></section>';
  return html;
}

function viewLeaveStep(lvs) {
  const m = S.ui.month;
  const info = monthInfo(m);
  const { types } = monthDayTypes(m);
  const list = lvs.slice().sort((a, b) => (a.from < b.from ? -1 : 1));
  let html = '<section class="panel">' + roBanner() +
    '<div class="panel-head"><div><h2>Planned leave in ' + monthLabel(m) + '</h2><p>Enter approved leave before generating. Doctors on leave are marked PL, get no week-offs on those days, and the rest of the team is scheduled around them.</p></div></div>';
  if (!list.length) html += '<div class="empty">No planned leave for ' + MONTHS[info.m] + ' yet. Add any approved leave below, or continue to generate the roster.</div>';
  else html += '<ul class="list">' + list.map(l => {
    const r = currentRes(l.resId);
    const from = l.from < info.first ? info.first : l.from, to = l.to > info.last ? info.last : l.to;
    const a = +from.slice(8, 10) - 1, b = +to.slice(8, 10) - 1;
    const n = b - a + 1;
    const fullHit = [];
    for (let d = a; d <= b; d++) if (types[d] === 'full') fullHit.push(d);
    return '<li class="list-item"><div class="date-badge pl"><b>' + n + '</b><span>' + (n === 1 ? 'day' : 'days') + '</span></div>' +
      '<div class="list-main"><strong>' + esc(r.name) + ' <span class="chip">' + r.team + '</span></strong><span class="sub">' +
      (l.from === l.to ? fmtDate(l.from) : fmtDate(l.from) + ' to ' + fmtDate(l.to)) + (l.note ? '. ' + esc(l.note) : '') + '</span></div>' +
      (fullHit.length ? '<span class="chip warn">Covers ' + plural(fullHit.length, 'full-strength day') + '</span>' : '') +
      '<button class="icon-btn del" data-act="lv-del" data-id="' + esc(l.id) + '" aria-label="Remove leave for ' + esc(r.name) + '"' + RO() + '>×</button></li>';
  }).join('') + '</ul>';
  const opts = TEAMS.map(t => '<optgroup label="' + t + '">' + S.resources.filter(r => r.team === t).map(r => '<option value="' + esc(r.id) + '">' + esc(r.name) + (r.empId ? ' (' + esc(r.empId) + ')' : '') + '</option>').join('') + '</optgroup>').join('');
  html += '<div class="adder"><h3>Add planned leave</h3><div class="form-row">' +
    '<label class="field grow">Doctor<select class="input" id="lv-res"' + RO() + '>' + opts + '</select></label>' +
    '<label class="field">From<input type="date" class="input" id="lv-from" value="' + info.first + '"' + RO() + '></label>' +
    '<label class="field">To<input type="date" class="input" id="lv-to" value="' + info.first + '"' + RO() + '></label>' +
    '<label class="field grow">Note (optional)<input type="text" class="input" id="lv-note" placeholder="e.g. Annual leave"' + RO() + '></label>' +
    '<button class="btn primary" data-act="lv-add"' + RO() + '>Add leave</button></div>' +
    '<p class="small muted" style="margin:12px 0 0">Leave can run into the next month. Leave on a Monday, Friday or the last date means that team can’t be at full strength, which the roster will flag.</p></div>';
  html += '<div class="step-actions"><button class="btn" data-act="step" data-step="2">Back</button><button class="btn primary" data-act="step" data-step="4">Continue to roster</button></div></section>';
  return html;
}

function viewRosterStep() {
  const m = S.ui.month;
  let r = S.ui.work[m];
  if (!r && S.saved[m]) { r = fromStored(S.saved[m]); S.ui.work[m] = r; }
  if (S.ui.busy) return '<section class="panel"><span class="busy"><span class="spinner"></span>Building the ' + monthLabel(m) + ' roster…</span></section>';
  if (!r) return viewReady();
  const v = validateRoster(r, nameOf);
  const stale = r.inputsKey && r.inputsKey !== inputsKey(m);
  const saved = r.savedAt && !r.dirty;
  let html = '<section class="panel">';
  html += '<div class="roster-head"><div><h2>' + monthLabel(m) + ' roster</h2><p class="meta">' +
    'Generated ' + fmtStamp(r.generatedAt) + (r.edited ? ', edited by hand' : '') + '. ' +
    (saved ? 'Saved to history ' + fmtStamp(r.savedAt) + '.' : 'Not saved to history yet.') + '</p></div>' +
    '<div class="actions"><button class="btn" data-act="regen">Try another arrangement</button>' +
    '<button class="btn" data-act="save"' + (P.readOnly && P.db ? ' disabled' : '') + '>' + (saved ? 'Saved' : 'Save to history') + '</button>' +
    '<button class="btn primary" data-act="export">Export CSV</button></div></div>';
  if (stale) html += '<div class="banner">Doctors, rules, holidays or leave have changed since this roster was generated.<button class="btn" data-act="regen-fresh">Generate again</button></div>';
  html += checksHTML(v);
  html += '<div class="toolbar"><div class="seg" role="group" aria-label="Show team">' + ['All', 'RM', 'CMU'].map(f =>
    '<button data-act="filter" data-f="' + f + '" aria-pressed="' + (S.ui.filter === f) + '">' + (f === 'All' ? 'Both teams' : f) + '</button>').join('') + '</div>' +
    '<div class="legend"><span><i class="key kG"></i>On duty ' + esc((r.shift || S.shift).start + '–' + (r.shift || S.shift).end) + '</span><span><i class="key kO">WO</i>Week off</span><span><i class="key kH">PH</i>Public holiday</span><span><i class="key kL">PL</i>Planned leave</span><span><i class="key fs"></i>Full-strength day</span></div></div>';
  html += '<div class="grid-wrap">' + gridHTML(r, v) + '</div>';
  html += '<div class="grid-foot"><span>Select any duty cell to switch it between on duty and week off. The checks above update straight away.</span>' +
    (r.edited ? '<button class="btn ghost" data-act="regen-fresh">Discard hand edits and regenerate</button>' : '') + '</div>';
  html += '</section>';
  return html;
}

function viewReady() {
  const m = S.ui.month;
  const info = monthInfo(m);
  const hols = S.holidays.filter(h => h.date.slice(0, 7) === m);
  const lvs = S.leaves.filter(l => !(l.to < info.first || l.from > info.last) && currentRes(l.resId));
  const on = S.rules.filter(r => r.enabled);
  const must = on.filter(r => RULE_TYPES[r.type].kind === 'must').length;
  const rm = S.resources.filter(r => r.team === 'RM').length, cmu = S.resources.filter(r => r.team === 'CMU').length;
  const prev = addMonths(m, -1);
  return '<section class="panel ready"><div><h2 style="margin:0;font-size:23px">Generate the ' + monthLabel(m) + ' roster</h2>' +
    '<p class="lede">The roster follows every enabled rule and places week-offs on preferred days where it can. You can adjust any cell afterwards.</p>' +
    '<ul class="ready-list">' +
    '<li><strong>' + plural(rm + cmu, 'doctor') + '</strong>' + rm + ' RM, ' + cmu + ' CMU</li>' +
    '<li><strong>' + plural(hols.length, 'public holiday') + '</strong>' + (hols.length ? esc(hols.map(h => h.name).join(', ')) : 'None this month') + '</li>' +
    '<li><strong>' + plural(lvs.length, 'leave entry', 'leave entries') + '</strong>' + (lvs.length ? esc([...new Set(lvs.map(l => currentRes(l.resId).name))].slice(0, 3).join(', ')) + (lvs.length > 3 ? ' and more' : '') : 'Nobody on planned leave') + '</li>' +
    '<li><strong>' + plural(on.length, 'rule') + ' on</strong>' + must + ' must, ' + (on.length - must) + ' best effort</li>' +
    '<li><strong>Streaks</strong>' + (S.saved[prev] ? 'Carried over from ' + monthLabel(prev) : 'Everyone starts fresh') + '</li>' +
    '</ul></div>' +
    '<div><button class="btn primary lg" data-act="generate"' + (S.resources.length ? '' : ' disabled') + '>Generate roster</button>' +
    (S.resources.length ? '' : '<p class="small muted">Add doctors in the Doctors tab first.</p>') + '</div></section>';
}

function checksHTML(v) {
  const items = [].concat(v.errors.map(i => ['err', 'Must fix', i]), v.warnings.map(i => ['warn', 'Leave', i]), v.notes.map(i => ['note', 'Note', i]));
  const head = v.ok
    ? '<span class="mark" aria-hidden="true">✓</span>All must-follow rules are met'
    : '<span class="mark" aria-hidden="true">!</span>' + plural(v.errors.length, 'rule problem') + ' to fix';
  const extra = [v.warnings.length ? plural(v.warnings.length, 'leave shortfall') : '', v.notes.length ? plural(v.notes.length, 'note') : ''].filter(Boolean).join(', ');
  let html = '<div class="checks ' + (v.ok ? 'ok' : 'bad') + '" role="status"><div class="checks-head">' + head + (extra ? '<span class="count">' + extra + '</span>' : '') + '</div>';
  if (items.length) {
    html += '<ul class="issues">' + items.map(([cls, lab, i], k) =>
      '<li><button data-act="flash" data-k="' + k + '"><span class="lvl ' + cls + '">' + lab + '</span><span>' + esc(i.text) + '</span></button></li>').join('') + '</ul>';
  }
  S.ui.issueRefs = items.map(x => x[2]);
  return html + '</div>';
}

function gridHTML(r, v) {
  const { D, dows } = r;
  const teams = S.ui.filter === 'All' ? TEAMS : [S.ui.filter];
  const holMap = {};
  const holOn = r.rules.some(x => x.enabled && x.type === 'holiday_off');
  r.holidays.forEach(h => { holMap[+h.date.slice(8, 10) - 1] = h.name; });
  const anyLocked = Array.from({ length: D }, (_, d) => TEAMS.some(t => v.day[t] && v.day[t][d].locked));
  const colCls = d => [isWeekend(dows[d]) ? 'wk' : '', anyLocked[d] ? 'fs' : '', holOn && holMap[d] !== undefined ? 'hol' : ''].filter(Boolean).join(' ');
  const maxStreak = r.rules.filter(x => x.enabled && x.type === 'max_streak').reduce((a, x) => Math.min(a, x.params.n), Infinity);
  const maxWork = r.rules.filter(x => x.enabled && x.type === 'max_work').reduce((a, x) => Math.min(a, x.params.n), Infinity);
  let h = '<table class="grid"><thead><tr><th class="nm" scope="col">Doctor</th>';
  for (let d = 0; d < D; d++) {
    const title = DOW_LONG[dows[d]] + ' ' + (d + 1) + (holOn && holMap[d] !== undefined ? ': ' + holMap[d] : anyLocked[d] ? ': full strength' : '');
    h += '<th scope="col" class="dh ' + colCls(d) + '" data-d="' + d + '" title="' + esc(title) + '"><span class="dn">' + (d + 1) + '</span><span class="dw">' + DOW2[dows[d]] + '</span></th>';
  }
  h += '<th class="tot first" scope="col" title="Duty days">Duty</th><th class="tot" scope="col" title="Week-offs">WO</th><th class="tot" scope="col" title="Planned leave days">PL</th><th class="tot" scope="col" title="Public holidays">PH</th><th class="tot" scope="col" title="Longest run of duty days">Run</th></tr></thead>';
  for (const team of teams) {
    const members = r.people.filter(p => p.team === team);
    if (!members.length) continue;
    h += '<tbody><tr class="grp"><th scope="rowgroup">' + team + ' team<span class="grp-sub">' + plural(members.length, 'doctor') + '</span></th><td colspan="' + (D + 5) + '"></td></tr>';
    for (const p of members) {
      const st = v.person[p.id];
      const g = r.codes[p.id];
      const pl = prefLabel(p.pref);
      h += '<tr data-p="' + esc(p.id) + '"><th scope="row" class="nm"><span class="nm-n">' + esc(nameOf(p)) + '</span><span class="nm-s">' + esc(empOf(p)) + (pl ? (empOf(p) ? ', ' : '') + 'prefers ' + esc(pl) : '') + '</span></th>';
      for (let d = 0; d < D; d++) {
        const c = g[d];
        const editable = c === 'G' || c === 'O';
        h += '<td class="c k' + c + ' ' + colCls(d) + '" data-d="' + d + '"><button type="button" data-act="cell" data-p="' + esc(p.id) + '" data-d="' + d + '" aria-label="' + esc(nameOf(p) + ', ' + DOW_LONG[dows[d]] + ' ' + (d + 1) + ': ' + CODE_LONG[c]) + '"' + (editable ? '' : ' disabled') + '>' + CODE_LABEL[c] + '</button></td>';
      }
      h += '<td class="tot first strong' + (st.work > maxWork ? ' bad' : '') + '">' + st.work + '</td><td class="tot">' + st.off + '</td><td class="tot">' + (st.leave || '') + '</td><td class="tot">' + (st.hol || '') + '</td><td class="tot' + (st.maxRun > maxStreak ? ' bad' : '') + '">' + st.maxRun + '</td></tr>';
    }
    const day = v.day[team];
    h += '<tr class="str"><th scope="row" class="nm">' + team + ' on duty, of ' + members.length + '</th>';
    for (let d = 0; d < D; d++) {
      const x = day[d];
      if (x.isHol) { h += '<td class="s na" data-d="' + d + '" title="Public holiday">–</td>'; continue; }
      const cls = !x.ok ? 'low' : x.work === x.N ? 'full' : '';
      const need = x.req ? ', ' + x.req + ' needed' : '';
      h += '<td class="s ' + cls + '" data-d="' + d + '" title="' + x.work + ' of ' + x.N + ' on duty' + need + '">' + x.work + '</td>';
    }
    h += '<td class="s-pad" colspan="5"></td></tr></tbody>';
  }
  return h + '</table>';
}
/* ---------- doctors tab ---------- */
function dayPicker(selected, act, id, blocked, teal) {
  return '<div class="daypick' + (teal ? ' teal' : '') + '" role="group">' + DOW_ORDER.map(d => {
    const on = selected.includes(d);
    const bl = blocked && blocked.has(d);
    return '<button type="button" data-act="' + act + '" data-id="' + esc(id) + '" data-dow="' + d + '" aria-pressed="' + on + '" aria-label="' + DOW_LONG[d] + (bl ? ', full-strength day' : '') + '"' +

/* ===== CSV ===== */
function csvCell(v) {
  let s = String(v == null ? '' : v);
  if (/^[=+\-@\t]/.test(s)) s = "'" + s;
  if (/[",\r\n]/.test(s)) s = '"' + s.replace(/"/g, '""') + '"';
  return s;
}
function rosterCSV(r) {
  const v = validateRoster(r, nameOf);
  const mon = MON_SHORT[parseYM(r.month).m];
  const sh = r.shift || S.shift;
  const shift = sh.start + '-' + sh.end;
  const rows = [];
  const head = ['Emp ID', 'Doctor', 'Team', 'Preferred week-off', 'Shift'];
  for (let d = 0; d < r.D; d++) head.push(pad(d + 1) + '-' + mon + ' (' + DOW_SHORT[r.dows[d]] + ')');
  head.push('Duty days', 'Week offs', 'Planned leave', 'Public holidays', 'Longest run');
  rows.push(head);
  for (const team of TEAMS) {
    for (const p of r.people.filter(x => x.team === team)) {
      const st = v.person[p.id];
      const row = [empOf(p), nameOf(p), team, prefLabel(p.pref), shift];
      for (let d = 0; d < r.D; d++) row.push(CODE_CSV[r.codes[p.id][d]]);
      row.push(st.work, st.off, st.leave, st.hol, st.maxRun);
      rows.push(row);
    }
  }
  rows.push([]);
  for (const team of TEAMS) {
    const day = v.day[team];
    if (!day) continue;
    rows.push(['', team + ' on duty', team, '', ''].concat(day.map(x => x.work)));
    rows.push(['', team + ' strength %', team, '', ''].concat(day.map(x => x.isHol ? '' : Math.round(x.work / x.N * 100))));
    rows.push(['', team + ' required', team, '', ''].concat(day.map(x => x.isHol ? '' : x.req)));
  }
  const holMap = {};
  r.holidays.forEach(h => { holMap[+h.date.slice(8, 10) - 1] = h.name; });
  rows.push(['', 'Public holiday', '', '', ''].concat(Array.from({ length: r.D }, (_, d) => holMap[d] || '')));
  rows.push([]);
  rows.push(['Legend', 'G = General shift ' + shift + '; WO = Week off; PH = Public holiday; PL = Planned leave']);
  rows.push(['Rule checks', v.ok ? 'All must-follow rules met' : v.errors.map(e => e.text).join(' ')]);
  if (v.warnings.length) rows.push(['Leave shortfalls', v.warnings.map(e => e.text).join(' ')]);
  rows.push(['Generated', fmtStamp(r.generatedAt)]);
  return '\uFEFF' + rows.map(row => row.map(csvCell).join(',')).join('\r\n');
}
async function exportRoster(r) {
  const csv = rosterCSV(r);
  const filename = 'Duty-roster-' + r.month + '-' + MONTHS[parseYM(r.month).m] + '.csv';
  const res = await saveFile(filename, csv, 'text/csv;charset=utf-8');
  if (res === 'saved') toast('Exported ' + filename);
  else if (res === 'declined') toast('Export cancelled');
  else if (res === 'busy') toast('An export prompt is already open');
  else if (res === 'fallback') csvFallback(csv, filename, 'CSV', 'text/csv;charset=utf-8');
}
function csvFallback(csv, filename, kind, mime) {
  kind = kind || 'CSV';
  const d = $('#dlg');
  let url = '';
  try { url = URL.createObjectURL(new Blob([csv], { type: mime || 'text/csv;charset=utf-8' })); } catch (e) { /* ignore */ }
  d.innerHTML = '<div class="dlg"><h2>Export ' + esc(filename) + '</h2><p>Copy the ' + kind + ' below and paste it into a new file, or use the download link if your browser allows it.</p>' +
    '<textarea readonly id="csv-text" aria-label="' + kind + ' contents">' + esc(csv.replace(/^\uFEFF/, '')) + '</textarea>' +
    '<div class="dlg-actions">' + (url ? '<a class="btn" href="' + url + '" download="' + esc(filename) + '">Download file</a>' : '') +
    '<button class="btn" id="csv-copy">Copy ' + kind + '</button><button class="btn primary" id="csv-close">Done</button></div></div>';
  d.showModal();
  $('#csv-close').onclick = () => d.close();
  $('#csv-copy').onclick = async () => {
    const ta = $('#csv-text');
    try { await navigator.clipboard.writeText(ta.value); toast(kind + ' copied'); }
    catch (e) { ta.select(); try { document.execCommand('copy'); toast(kind + ' copied'); } catch (e2) { toast('Select the text and copy it'); } }
  };
}

/* ===== actions ===== */
function workRoster() { return S.ui.work[S.ui.month]; }
function markEdited(r) { r.dirty = true; saveDrafts(); render(); }
function runGenerate(seed) {
  const m = S.ui.month;
  S.ui.busy = true;
  render();
  setTimeout(() => {
    try {
      S.ui.work[m] = generateBest(m, seed);
      saveDrafts();
    } catch (e) {
      console.error(e);
      toast('The roster could not be generated. Check the rules and try again.');
    }
    S.ui.busy = false;
    render();
  }, 30);
}
async function regenerate(fresh) {
  const r = workRoster();
  if (r && r.edited) {
    const ok = await confirmBox({ title: 'Discard hand edits?', body: 'Generating again replaces the cells you changed by hand.', ok: 'Generate again', danger: true });
    if (!ok) return;
  }
  runGenerate(r ? (r.seed + (r.tries || 1)) : 1);
}

const ACT = {
  tab(t) { S.ui.tab = t.dataset.tab; render(); window.scrollTo(0, 0); },
  step(t) { S.ui.step = +t.dataset.step; render(); window.scrollTo(0, 0); },
  'month-shift'(t) { S.ui.month = addMonths(S.ui.month, +t.dataset.k); render(); },
  'hol-add'() {
    const date = $('#hol-date').value, name = $('#hol-name').value.trim();
    if (!isISO(date) || date.slice(0, 7) !== S.ui.month) { toast('Pick a date in ' + monthLabel(S.ui.month)); return; }
    if (!name) { toast('Give the holiday a name'); $('#hol-name').focus(); return; }
    if (S.holidays.some(h => h.date === date)) { toast(fmtDate(date) + ' is already a holiday'); return; }
    S.holidays.push({ id: uid('hol'), date, name });
    persist('holidays'); render(); toast('Added ' + name);
  },
  'hol-sugg'(t) {
    if (S.holidays.some(h => h.date === t.dataset.date)) return;
    S.holidays.push({ id: uid('hol'), date: t.dataset.date, name: t.dataset.name });
    persist('holidays'); render(); toast('Added ' + t.dataset.name);
  },
  'hol-del'(t) { S.holidays = S.holidays.filter(h => h.id !== t.dataset.id); persist('holidays'); render(); },
  'lv-add'() {
    const resId = $('#lv-res').value;
    let from = $('#lv-from').value, to = $('#lv-to').value || from;
    const note = $('#lv-note').value.trim();
    if (!currentRes(resId)) { toast('Choose a doctor'); return; }
    if (!isISO(from) || !isISO(to)) { toast('Enter the leave dates'); return; }
    if (from > to) [from, to] = [to, from];
    S.leaves.push({ id: uid('lv'), resId, from, to, note });
    persist('leaves'); render(); toast('Leave added for ' + currentRes(resId).name);
  },
  'lv-del'(t) { S.leaves = S.leaves.filter(l => l.id !== t.dataset.id); persist('leaves'); render(); },
  generate() { runGenerate(1); },
  regen() { regenerate(false); },
  'regen-fresh'() { regenerate(true); },
  async save() {
    const r = workRoster();
    if (!r) return;
    const v = validateRoster(r, nameOf);
    if (!v.ok) {
      const ok = await confirmBox({ title: 'Save with rule problems?', body: 'This roster breaks ' + plural(v.errors.length, 'must-follow rule') + '. You can still save it and fix it later.', ok: 'Save anyway' });
      if (!ok) return;
    }
    r.people.forEach(p => { const c = currentRes(p.id); if (c) { p.name = c.name; p.empId = c.empId; } });
    r.savedAt = new Date().toISOString();
    r.dirty = false;
    await saveRosterDoc(toStored(r));
    saveDrafts(); render(); toast(monthLabel(r.month) + ' roster saved to history');
  },
  export() { const r = workRoster(); if (r) exportRoster(r); },
  filter(t) { S.ui.filter = t.dataset.f; render(); },
  cell(t) {
    const r = workRoster();
    if (!r) return;
    const g = r.codes[t.dataset.p], d = +t.dataset.d;
    if (!g || (g[d] !== 'G' && g[d] !== 'O')) return;
    g[d] = g[d] === 'G' ? 'O' : 'G';
    r.edited = true;
    markEdited(r);
    const again = document.querySelector('[data-act="cell"][data-p="' + CSS.escape(t.dataset.p) + '"][data-d="' + d + '"]');
    if (again) again.focus();
  },
  flash(t) {
    const it = (S.ui.issueRefs || [])[+t.dataset.k];
    if (!it) return;
    const wrap = $('.grid-wrap');
    const els = [];
    (it.days || []).forEach(d => $$('[data-d="' + d + '"]', wrap).forEach(e => { if (e.tagName !== 'BUTTON') els.push(e); }));
    (it.people || []).forEach(id => { const tr = $('tr[data-p="' + CSS.escape(id) + '"]', wrap); if (tr) els.push(tr); });
    if (it.team && S.ui.filter !== 'All' && S.ui.filter !== it.team) { S.ui.filter = 'All'; render(); return ACT.flash(t); }
    els.forEach(e => { e.classList.remove('flash'); void e.offsetWidth; e.classList.add('flash'); });
    const first = (it.people && it.people.length) ? $('tr[data-p="' + CSS.escape(it.people[0]) + '"]', wrap) : (it.days && it.days.length ? $('th[data-d="' + it.days[0] + '"]', wrap) : null);
    if (first && wrap) {
      const wr = wrap.getBoundingClientRect(), fr = first.getBoundingClientRect();
      if (first.tagName === 'TH') wrap.scrollLeft += fr.left - wr.left - 220;
      else wrap.scrollTop += fr.top - wr.top - 80;
      if (it.days && it.days.length && first.tagName === 'TR') {
        const col = $('th[data-d="' + it.days[0] + '"]', wrap);
        if (col) wrap.scrollLeft += col.getBoundingClientRect().left - wr.left - 220;
      }
      wrap.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
    }
    setTimeout(() => els.forEach(e => e.classList.remove('flash')), 1900);
  },
  'res-add'() {
    const name = $('#new-name').value.trim();
    const team = $('#new-team').value;
    let empId = $('#new-emp').value.trim();
    if (!name) { toast('Enter the doctor’s name'); $('#new-name').focus(); return; }
    if (!empId) empId = nextEmpId(team);
    S.resources.push({ id: uid('res'), empId, name, team, pref: [] });
    persist('team'); render(); toast('Added ' + name + ' to ' + team);
  },
  async 'res-del'(t) {
    const r = currentRes(t.dataset.id);
    if (!r) return;
    const nLv = S.leaves.filter(l => l.resId === r.id).length;
    const ok = await confirmBox({ title: 'Remove ' + r.name + '?', body: 'They will be left out of future rosters' + (nLv ? ' and their ' + plural(nLv, 'leave entry', 'leave entries') + ' will be removed' : '') + '. Saved rosters in history keep them.', ok: 'Remove doctor', danger: true });
    if (!ok) return;
    S.resources = S.resources.filter(x => x.id !== r.id);
    if (nLv) { S.leaves = S.leaves.filter(l => l.resId !== r.id); persist('leaves'); }
    let touched = false;
    S.rules.forEach(x => { if (x.params.except && x.params.except.includes(r.id)) { x.params.except = x.params.except.filter(id => id !== r.id); touched = true; } });
    if (touched) persist('rules');
    persist('team'); render();
  },
  'res-pref'(t) {
    const r = currentRes(t.dataset.id);
    if (!r) return;
    const d = +t.dataset.dow;
    r.pref = r.pref.includes(d) ? r.pref.filter(x => x !== d) : r.pref.concat(d);
    persist('team'); render();
  },
  'bulk-add'() {
    const lines = $('#bulk').value.split(/\r?\n/).map(s => s.trim()).filter(Boolean);
    let added = 0;
    const skipped = [];
    for (const line of lines) {
      const parts = line.split(/\t|,/).map(s => s.trim());
      const name = parts[0];
      const team = (parts[1] || '').toUpperCase();
      if (!name || !TEAMS.includes(team)) { skipped.push(line); continue; }
      const pref = [];
      (parts[2] || '').toLowerCase().split(/[\s/;&+]+/).forEach(w => {
        const i = DOW_LONG.findIndex(x => w && x.toLowerCase().startsWith(w.slice(0, 3)) && w.length >= 2);
        if (i >= 0 && !pref.includes(i)) pref.push(i);
      });
      S.resources.push({ id: uid('res'), empId: parts[3] || nextEmpId(team), name, team, pref });
      added++;
    }
    if (added) persist('team');
    render();
    toast(added ? 'Added ' + plural(added, 'doctor') + (skipped.length ? '. Skipped ' + skipped.length + ' line(s) without RM or CMU as the team.' : '') : 'Nothing added. Each line needs a name and RM or CMU.');
  },
  async 'team-reset'() {
    const ok = await confirmBox({ title: 'Reset the doctor list?', body: 'This replaces every doctor with 20 RM and 4 CMU placeholders and clears all planned leave.', ok: 'Reset doctors', danger: true });
    if (!ok) return;
    S.resources = defaultResources(); S.leaves = [];
    persist('team'); persist('leaves'); render();
  },
  'rule-day'(t) {
    const r = t.dataset.id === '__new' ? S.ui.draft : S.rules.find(x => x.id === t.dataset.id);
    if (!r) return;
    const d = +t.dataset.dow;
    const days = r.params.days || [];
    r.params.days = days.includes(d) ? days.filter(x => x !== d) : days.concat(d);
    if (t.dataset.id !== '__new') persist('rules');
    render();
  },
  'rule-team'(t) {
    const r = t.dataset.id === '__new' ? S.ui.draft : S.rules.find(x => x.id === t.dataset.id);
    if (!r) return;
    const tm = t.dataset.team;
    const cur = r.params.teams || [];
    const next = cur.includes(tm) ? cur.filter(x => x !== tm) : cur.concat(tm);
    if (!next.length) { toast('A rule needs at least one team'); return; }
    r.params.teams = TEAMS.filter(x => next.includes(x));
    if (t.dataset.id !== '__new') persist('rules');
    render();
  },
  async 'rule-del'(t) {
    const r = S.rules.find(x => x.id === t.dataset.id);
    if (!r) return;
    const ok = await confirmBox({ title: 'Delete this rule?', body: ruleTitle(r) + '. To pause a rule instead, switch it off.', ok: 'Delete rule', danger: true });
    if (!ok) return;
    S.rules = S.rules.filter(x => x.id !== r.id);
    persist('rules'); render();
  },
  'rule-ex-del'(t) {
    const r = S.rules.find(x => x.id === t.dataset.id);
    if (!r) return;
    r.params.except = (r.params.except || []).filter(id => id !== t.dataset.res);
    persist('rules'); render();
  },
  'rule-add'() {
    const d = S.ui.draft;
    if (!d) return;
    if (d.params.days && !d.params.days.length) { toast('Pick at least one day'); return; }
    if (d.params.dates && !d.params.dates.length) { toast('Enter at least one date'); return; }
    S.rules.push({ id: uid('rule'), type: d.type, enabled: true, params: clone(d.params) });
    S.ui.draft = null;
    persist('rules'); render(); toast('Rule added');
  },
  async 'rules-reset'() {
    const ok = await confirmBox({ title: 'Restore default rules?', body: 'Your custom rules and changes will be replaced with the original set.', ok: 'Restore defaults', danger: true });
    if (!ok) return;
    S.rules = defaultRules(); S.shift = { start: '09:00', end: '19:00' };
    persist('rules'); render();
  },
  'hist-open'(t) {
    const m = t.dataset.m;
    if (!S.saved[m]) return;
    S.ui.work[m] = fromStored(S.saved[m]);
    S.ui.month = m; S.ui.tab = 'roster'; S.ui.step = 4;
    render(); window.scrollTo(0, 0);
  },
  async backup() {
    const d = new Date();
    const filename = 'Duty-roster-backup-' + d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()) + '.json';
    const json = JSON.stringify(backupData(), null, 1);
    const res = await saveFile(filename, json, 'application/json');
    if (res === 'saved') toast('Backup downloaded');
    else if (res === 'declined') toast('Backup cancelled');
    else if (res === 'fallback') csvFallback(json, filename, 'backup', 'application/json');
  },
  'hist-export'(t) { const d = S.saved[t.dataset.m]; if (d) exportRoster(fromStored(d)); },
  async 'hist-del'(t) {
    const m = t.dataset.m;
    const ok = await confirmBox({ title: 'Delete the ' + monthLabel(m) + ' roster?', body: 'It will be removed from history for everyone. ' + monthLabel(addMonths(m, 1)) + ' will no longer carry streaks over from it.', ok: 'Delete roster', danger: true });
    if (!ok) return;
    await deleteRosterDoc(m);
    if (S.ui.work[m] && S.ui.work[m].savedAt) { S.ui.work[m].savedAt = null; S.ui.work[m].dirty = true; }
    render();
  },
};

const CHG = {
  month(t) { if (/^\d{4}-\d{2}$/.test(t.value)) { S.ui.month = t.value; render(); } },
  'res-field'(t) {
    const r = currentRes(t.dataset.id);
    if (!r) return;
    r[t.dataset.field] = t.value.trim().slice(0, 120);
    persist('team');
    if (S.ui.tab !== 'team') render();
  },
  'res-team'(t) { const r = currentRes(t.dataset.id); if (r && TEAMS.includes(t.value)) { r.team = t.value; persist('team'); render(); } },
  'rule-toggle'(t) { const r = S.rules.find(x => x.id === t.dataset.id); if (r) { r.enabled = t.checked; persist('rules'); render(); } },
  'rule-num'(t) {
    const r = t.dataset.id === '__new' ? S.ui.draft : S.rules.find(x => x.id === t.dataset.id);
    if (!r) return;
    const key = t.dataset.key;
    const max = key === 'pct' ? 100 : 31;
    const v = Math.max(1, Math.min(max, Math.round(+t.value || 1)));
    r.params[key] = v;
    if (t.dataset.id !== '__new') persist('rules');
    render();
  },
  'rule-dates'(t) {
    const r = t.dataset.id === '__new' ? S.ui.draft : S.rules.find(x => x.id === t.dataset.id);
    if (!r) return;
    r.params.dates = [...new Set(t.value.split(/[^0-9]+/).map(Number).filter(n => n >= 1 && n <= 31))].sort((a, b) => a - b);
    if (t.dataset.id !== '__new') persist('rules');
    render();
  },
  'rule-ex-add'(t) {
    const r = S.rules.find(x => x.id === t.dataset.id);
    const d = currentRes(t.value);
    if (!r || !d) return;
    r.params.except = [...new Set((r.params.except || []).concat(d.id))];
    persist('rules'); render();
    toast(d.name + ' can now be given week-offs on these days');
  },
  'rule-fill'(t) {
    const r = t.dataset.id === '__new' ? S.ui.draft : S.rules.find(x => x.id === t.dataset.id);
    if (!r) return;
    r.params[t.dataset.key === 'extra' ? 'extra' : 'fill'] = t.checked;
    if (!r.params.fill) r.params.extra = false;
    if (t.dataset.id !== '__new') persist('rules');
    render();
  },
  async restore(t) {
    const file = t.files && t.files[0];
    t.value = '';
    if (!file) return;
    let obj;
    try { obj = JSON.parse(await file.text()); } catch (e) { toast('That file couldn’t be read as a backup.'); return; }
    const n = obj && obj.rosters ? Object.keys(obj.rosters).length : 0;
    const ok = await confirmBox({ title: 'Restore this backup?', body: 'It has ' + plural((obj.team || []).length, 'doctor') + ' and ' + plural(n, 'saved roster') + (obj.exportedAt ? ', saved ' + fmtStamp(obj.exportedAt) : '') + '. Your current doctors, rules, holidays, leave and saved rosters will be replaced.', ok: 'Restore backup', danger: true });
    if (!ok) return;
    try { await restoreData(obj); render(); toast('Backup restored'); }
    catch (e) { toast(e.message || 'The backup couldn’t be restored.'); }
  },
  'draft-type'(t) { if (RULE_TYPES[t.value]) { S.ui.draft = { type: t.value, params: defaultParams(t.value) }; render(); } },
  shift(t) { if (/^\d{2}:\d{2}$/.test(t.value)) { S.shift[t.dataset.key] = t.value; persist('rules'); render(); } },
};

function nextEmpId(team) {
  let n = 0;
  for (const r of S.resources) {
    const m = new RegExp('^' + team + '(\\d+)$', 'i').exec(r.empId || '');
    if (m) n = Math.max(n, +m[1]);
  }
  return team + pad(n + 1);
}

/* ===== startup ===== */
async function init() {
  loadLocal();
  document.addEventListener('click', e => {
    const t = e.target.closest('[data-act]');
    if (!t || t.disabled) return;
    const fn = ACT[t.dataset.act];
    if (fn) { e.preventDefault(); fn(t, e); }
  });
  document.addEventListener('change', e => {
    const t = e.target.closest('[data-chg]');
    if (!t) return;
    const fn = CHG[t.dataset.chg];
    if (fn) fn(t, e);
  });
  document.addEventListener('keydown', e => {
    if (e.key === 'Enter' && e.target.matches('#hol-name')) ACT['hol-add']();
    if (e.key === 'Enter' && e.target.matches('#new-name, #new-emp')) ACT['res-add']();
  });
  render();
  if (!window.claude || typeof window.claude.use !== 'function') { setSync('local'); return; }
  setSync('connecting');
  P.downloads = window.claude.use('downloads').catch(() => null);
  const [db, user] = await Promise.all([
    window.claude.use('db').catch(() => null),
    window.claude.use('user').catch(() => null),
  ]);
  if (!db) { setSync('local'); return; }
  P.db = db;
  if (user) {
    try { if ((await user.can('data.write')) === false) P.readOnly = true; } catch (e) { /* keep controls */ }
  }
  setSync(P.readOnly ? 'readonly' : 'shared');
  subscribe();
  render();
}
init();
</script>
