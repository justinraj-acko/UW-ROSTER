<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Doctor duty roster</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Next:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<style>
:root {
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
  --paper: #EDF2F0;
  --surface: #FFFFFF;
  --surface-2: #F5F8F7;
  --ink: #14313A;
  --ink-2: #4F666D;
  --ink-3: #7B9095;
  --line: #D2DDDA;
  --line-2: #E3EBE8;
  --primary: #0A6B61;
  --primary-hover: #085A51;
  --primary-ink: #FFFFFF;
  --primary-soft: #D5ECE6;
  --work: #E1F0EB;
  --wkcol: #F2F6F5;
  --wo: #F3C852;
  --wo-ink: #4A3300;
  --ph: #DCD1F4;
  --ph-ink: #3B2474;
  --ph-strong: #7657C4;
  --pl: #F7D2D5;
  --pl-ink: #7A1C28;
  --ok: #1F7646;
  --ok-soft: #DCF0E3;
  --bad: #B3302D;
  --bad-soft: #FBE0DE;
  --warn: #8D5B00;
  --warn-soft: #FBEFCF;
  --focus: #1C7ED6;
  --shadow: 0 1px 0 rgba(20, 49, 58, .05), 0 10px 28px -16px rgba(20, 49, 58, .28);
  --font: "Atkinson Hyperlegible Next", "Atkinson Hyperlegible", "Segoe UI", system-ui, -apple-system, Roboto, "Helvetica Neue", Arial, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #0D191D; --surface: #14242A; --surface-2: #1A2D33; --ink: #E2ECEA; --ink-2: #A2B7B8; --ink-3: #7A8F93;
    --line: #2A3E44; --line-2: #213439; --primary: #43C0AF; --primary-hover: #5BD0C0; --primary-ink: #052520; --primary-soft: #173B36;
    --work: #193631; --wkcol: #172A2F; --wo: #DDAF42; --wo-ink: #281B00; --ph: #34295B; --ph-ink: #D8CBFA; --ph-strong: #A68CEB;
    --pl: #4D222A; --pl-ink: #F6C0C5; --ok: #5BCB8B; --ok-soft: #163927; --bad: #F2807A; --bad-soft: #43201F; --warn: #E8B552; --warn-soft: #3B2E10;
    --focus: #6CB6FF; --shadow: 0 1px 0 rgba(0, 0, 0, .3), 0 12px 30px -16px rgba(0, 0, 0, .7);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #0D191D; --surface: #14242A; --surface-2: #1A2D33; --ink: #E2ECEA; --ink-2: #A2B7B8; --ink-3: #7A8F93;
  --line: #2A3E44; --line-2: #213439; --primary: #43C0AF; --primary-hover: #5BD0C0; --primary-ink: #052520; --primary-soft: #173B36;
  --work: #193631; --wkcol: #172A2F; --wo: #DDAF42; --wo-ink: #281B00; --ph: #34295B; --ph-ink: #D8CBFA; --ph-strong: #A68CEB;
  --pl: #4D222A; --pl-ink: #F6C0C5; --ok: #5BCB8B; --ok-soft: #163927; --bad: #F2807A; --bad-soft: #43201F; --warn: #E8B552; --warn-soft: #3B2E10;
  --focus: #6CB6FF; --shadow: 0 1px 0 rgba(0, 0, 0, .3), 0 12px 30px -16px rgba(0, 0, 0, .7);
  color-scheme: dark;
}
*, *::before, *::after { box-sizing: inherit; }
html { scroll-padding-top: env(safe-area-inset-top, 0px); -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--paper); color: var(--ink); font-family: var(--font);
  font-size: 15.5px; line-height: 1.5; font-variant-numeric: tabular-nums;
}
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* ---------- app bar ---------- */
.appbar { background: var(--surface); border-bottom: 1px solid var(--line); }
.appbar-in { max-width: 1440px; margin: 0 auto; padding: 14px clamp(14px, 3vw, 32px) 0; }
.brand-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.brand { display: flex; align-items: center; gap: 12px; }
.brand-mark { width: 34px; height: 34px; flex: none; }
.brand h1 { margin: 0; font-size: 20px; font-weight: 800; letter-spacing: -.01em; line-height: 1.15; }
.brand p { margin: 0; font-size: 13px; color: var(--ink-2); }
.sync { display: inline-flex; align-items: center; gap: 8px; font-size: 13px; color: var(--ink-2); padding: 5px 12px; border-radius: 999px; background: var(--surface-2); border: 1px solid var(--line-2); }
.sync::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--ink-3); }
.sync.shared::before { background: var(--ok); }
.sync.readonly::before { background: var(--warn); }
.sync.error::before { background: var(--bad); }
.tabs { display: flex; gap: 4px; margin-top: 12px; overflow-x: auto; scrollbar-width: none; }
.tabs::-webkit-scrollbar { display: none; }
.tab { border: 0; background: none; padding: 10px 14px 12px; font-weight: 700; color: var(--ink-2); cursor: pointer; border-bottom: 3px solid transparent; white-space: nowrap; font-size: 15px; }
.tab:hover { color: var(--ink); }
.tab[aria-selected="true"] { color: var(--primary); border-bottom-color: var(--primary); }
.tab .count { font-weight: 500; color: var(--ink-3); margin-left: 4px; }

main { max-width: 1440px; margin: 0 auto; padding: 22px clamp(14px, 3vw, 32px) 64px; }

/* ---------- common ---------- */
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; box-shadow: var(--shadow); padding: clamp(16px, 2.4vw, 28px); }
.panel + .panel { margin-top: 18px; }
.panel-head { display: flex; justify-content: space-between; align-items: flex-end; gap: 16px; flex-wrap: wrap; margin-bottom: 18px; }
.panel-head h2 { margin: 0; font-size: 23px; font-weight: 800; letter-spacing: -.01em; line-height: 1.2; }
.panel-head p, .lede { margin: 4px 0 0; color: var(--ink-2); max-width: 70ch; }
h3 { margin: 0 0 6px; font-size: 18px; font-weight: 700; }
.muted { color: var(--ink-2); }
.small { font-size: 13px; }
.btn { text-decoration: none; display: inline-flex; align-items: center; justify-content: center; gap: 8px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); padding: 9px 16px; border-radius: 9px; font-weight: 700; cursor: pointer; font-size: 14.5px; line-height: 1.2; white-space: nowrap; }
.btn:hover { background: var(--surface-2); border-color: var(--ink-3); }
.btn.primary { background: var(--primary); border-color: var(--primary); color: var(--primary-ink); }
.btn.primary:hover { background: var(--primary-hover); border-color: var(--primary-hover); }
.btn.danger { color: var(--bad); border-color: color-mix(in srgb, var(--bad) 45%, var(--line)); }
.btn.danger.solid { background: var(--bad); color: #fff; border-color: var(--bad); }
.btn.lg { padding: 13px 24px; font-size: 16px; border-radius: 11px; }
.btn.ghost { border-color: transparent; background: transparent; }
.btn.ghost:hover { background: var(--surface-2); }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.icon-btn { width: 36px; height: 36px; border-radius: 50%; border: 1px solid var(--line); background: var(--surface); display: inline-grid; place-items: center; cursor: pointer; font-size: 18px; line-height: 1; color: var(--ink-2); flex: none; }
.icon-btn:hover { color: var(--ink); border-color: var(--ink-3); }
.icon-btn.del:hover { color: var(--bad); border-color: var(--bad); }
.icon-btn svg { width: 16px; height: 16px; }
.field { display: flex; flex-direction: column; gap: 5px; font-size: 13px; font-weight: 700; color: var(--ink-2); }
.input, .field input, .field select, .field textarea, select.input {
  min-height: 40px; border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 8px 10px; font-size: 15px; font-weight: 400; color: var(--ink); min-width: 0;
}
.input:focus, .field input:focus, .field select:focus, .field textarea:focus { border-color: var(--primary); outline: 2px solid color-mix(in srgb, var(--primary) 30%, transparent); outline-offset: 0; }
input[type="number"].input { width: 76px; }
.form-row { display: flex; flex-wrap: wrap; gap: 12px; align-items: flex-end; }
.form-row .grow { flex: 1 1 200px; }
.actions { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.step-actions { display: flex; justify-content: space-between; gap: 10px; margin-top: 24px; padding-top: 18px; border-top: 1px solid var(--line-2); flex-wrap: wrap; }
.empty { padding: 22px; border: 1px dashed var(--line); border-radius: 12px; color: var(--ink-2); background: var(--surface-2); }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px; border-radius: 999px; font-size: 12.5px; font-weight: 700; background: var(--surface-2); color: var(--ink-2); border: 1px solid var(--line-2); white-space: nowrap; }
.chip.warn { background: var(--warn-soft); color: var(--warn); border-color: transparent; }
.chip.must { background: var(--primary-soft); color: var(--primary); border-color: transparent; }
.chip.try { background: var(--surface-2); color: var(--ink-2); }
.banner { padding: 12px 16px; border-radius: 10px; background: var(--warn-soft); color: var(--warn); font-weight: 600; display: flex; gap: 12px; align-items: center; justify-content: space-between; flex-wrap: wrap; margin-bottom: 14px; }
.banner.info { background: var(--primary-soft); color: var(--primary); }
.table-wrap { overflow-x: auto; }
table.plain { width: 100%; border-collapse: collapse; font-size: 14.5px; }
table.plain th { text-align: left; font-size: 13px; color: var(--ink-2); font-weight: 700; padding: 8px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; }
table.plain td { padding: 8px 10px; border-bottom: 1px solid var(--line-2); vertical-align: middle; }
table.plain tr.group-row td { background: var(--surface-2); font-weight: 800; font-size: 13.5px; color: var(--ink-2); padding: 8px 10px; }

/* ---------- steps ---------- */
.steps { list-style: none; margin: 0 0 18px; padding: 0; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
.step { width: 100%; display: flex; align-items: center; gap: 12px; text-align: left; padding: 12px 14px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); cursor: pointer; }
.step:hover { border-color: var(--ink-3); }
.step-n { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; font-weight: 800; font-size: 14px; background: var(--surface-2); color: var(--ink-2); border: 1px solid var(--line); flex: none; }
.step-text { display: flex; flex-direction: column; min-width: 0; }
.step-label { font-weight: 800; font-size: 14.5px; line-height: 1.25; }
.step-sub { font-size: 12.5px; color: var(--ink-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.step[aria-current="step"] { border-color: var(--primary); box-shadow: inset 0 0 0 1px var(--primary); }
.step[aria-current="step"] .step-n { background: var(--primary); color: var(--primary-ink); border-color: var(--primary); }
.step.done .step-n { background: var(--primary-soft); color: var(--primary); border-color: transparent; }

/* ---------- month step ---------- */
.month-hero { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
.month-name { margin: 0; font-size: clamp(40px, 7vw, 72px); font-weight: 800; letter-spacing: -.035em; line-height: 1; }
.month-name .yr { font-weight: 400; color: var(--ink-3); letter-spacing: -.02em; }
.month-jump { margin-left: auto; }
.month-body { display: grid; grid-template-columns: minmax(260px, 360px) 1fr; gap: clamp(20px, 4vw, 48px); margin-top: 26px; align-items: start; }
.cal { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
.cal-h { font-size: 12px; font-weight: 700; color: var(--ink-3); text-align: center; padding-bottom: 2px; }
.cal-d { aspect-ratio: 1; display: grid; place-items: center; border-radius: 8px; font-weight: 700; font-size: 14px; background: var(--work); color: var(--ink); position: relative; }
.cal-d.blank { background: transparent; }
.cal-d.t-min { background: var(--wkcol); color: var(--ink-2); box-shadow: inset 0 0 0 1px var(--line); }
.cal-d.t-full { background: var(--primary); color: var(--primary-ink); }
.cal-d.t-hol { background: var(--ph); color: var(--ph-ink); }
.cal-legend { display: flex; flex-wrap: wrap; gap: 8px 16px; margin-top: 14px; font-size: 13px; color: var(--ink-2); }
.cal-legend span { display: inline-flex; align-items: center; gap: 6px; }
.sw { width: 14px; height: 14px; border-radius: 4px; display: inline-block; flex: none; }
.sw.full { background: var(--primary); } .sw.min { background: var(--wkcol); box-shadow: inset 0 0 0 1px var(--line); }
.sw.open { background: var(--work); } .sw.hol { background: var(--ph); }
.facts { margin: 0; display: grid; grid-template-columns: max-content 1fr; gap: 12px 20px; }
.facts dt { font-weight: 800; font-size: 28px; line-height: 1.1; letter-spacing: -.02em; text-align: right; min-width: 2.2ch; }
.facts dd { margin: 0; align-self: center; color: var(--ink-2); }
.facts dd strong { color: var(--ink); }
.note { margin-top: 18px; padding: 12px 14px; border-radius: 10px; background: var(--surface-2); border: 1px solid var(--line-2); font-size: 14px; color: var(--ink-2); }

/* ---------- holidays & leave ---------- */
.list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
.list-item { display: flex; align-items: center; gap: 14px; padding: 10px 12px 10px 14px; border-radius: 11px; border: 1px solid var(--line); background: var(--surface); flex-wrap: wrap; }
.date-badge { width: 50px; flex: none; text-align: center; border-radius: 9px; padding: 5px 0 6px; background: var(--ph); color: var(--ph-ink); line-height: 1.05; }
.date-badge b { display: block; font-size: 20px; font-weight: 800; }
.date-badge span { font-size: 11.5px; font-weight: 700; }
.date-badge.pl { background: var(--pl); color: var(--pl-ink); width: auto; padding: 6px 10px; }
.list-main { flex: 1 1 200px; min-width: 0; }
.list-main strong { display: block; }
.list-main .sub { font-size: 13px; color: var(--ink-2); }
.adder { margin-top: 18px; padding: 16px; border-radius: 12px; background: var(--surface-2); border: 1px solid var(--line-2); }
.adder h3 { font-size: 15.5px; margin-bottom: 10px; }
.sugg { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; align-items: center; }
.sugg-btn { border: 1px dashed var(--ph-strong); color: var(--ph-ink); background: transparent; padding: 6px 12px; border-radius: 999px; cursor: pointer; font-weight: 700; font-size: 13.5px; }
.sugg-btn:hover { background: var(--ph); }

/* ---------- ready ---------- */
.ready { display: grid; grid-template-columns: 1fr auto; gap: 24px; align-items: center; }
.ready-list { list-style: none; margin: 12px 0 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 10px; }
.ready-list li { padding: 12px 14px; border-radius: 11px; background: var(--surface-2); border: 1px solid var(--line-2); font-size: 13.5px; color: var(--ink-2); }
.ready-list strong { display: block; font-size: 16px; color: var(--ink); }

/* ---------- roster ---------- */
.roster-head { display: flex; justify-content: space-between; gap: 16px; align-items: flex-end; flex-wrap: wrap; margin-bottom: 16px; }
.roster-head h2 { margin: 0; font-size: clamp(26px, 3.4vw, 36px); font-weight: 800; letter-spacing: -.025em; line-height: 1.1; }
.roster-head .meta { margin: 4px 0 0; color: var(--ink-2); font-size: 14px; }
.checks { border-radius: 12px; border: 1px solid var(--line); background: var(--surface); margin-bottom: 14px; overflow: hidden; }
.checks-head { display: flex; align-items: center; gap: 12px; padding: 12px 16px; font-weight: 800; }
.checks-head .mark { width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; flex: none; color: #fff; font-size: 14px; }
.checks.ok .checks-head { background: var(--ok-soft); color: var(--ok); }
.checks.ok .mark { background: var(--ok); }
.checks.bad .checks-head { background: var(--bad-soft); color: var(--bad); }
.checks.bad .mark { background: var(--bad); }
.checks-head .count { font-weight: 600; font-size: 13.5px; opacity: .85; margin-left: auto; }
.issues { list-style: none; margin: 0; padding: 6px 8px 8px; }
.issues li button { all: unset; box-sizing: border-box; display: flex; gap: 10px; width: 100%; padding: 7px 8px; border-radius: 8px; cursor: pointer; font-size: 14px; line-height: 1.4; }
.issues li button:hover { background: var(--surface-2); }
.issues li button:focus-visible { outline: 2px solid var(--focus); }
.issues .lvl { flex: none; font-size: 11.5px; font-weight: 800; padding: 2px 8px; border-radius: 999px; height: fit-content; margin-top: 1px; }
.lvl.err { background: var(--bad-soft); color: var(--bad); }
.lvl.warn { background: var(--warn-soft); color: var(--warn); }
.lvl.note { background: var(--surface-2); color: var(--ink-2); border: 1px solid var(--line); }
.toolbar { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 10px; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 10px; padding: 3px; background: var(--surface); }
.seg button { border: 0; background: none; padding: 6px 14px; border-radius: 7px; font-weight: 700; font-size: 14px; color: var(--ink-2); cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--surface); }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 13px; color: var(--ink-2); align-items: center; }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.key { display: inline-grid; place-items: center; min-width: 28px; height: 20px; padding: 0 4px; border-radius: 4px; font-size: 10.5px; font-weight: 800; }
.key.kG { background: var(--work); } .key.kO { background: var(--wo); color: var(--wo-ink); }
.key.kH { background: var(--ph); color: var(--ph-ink); } .key.kL { background: var(--pl); color: var(--pl-ink); }
.key.fs { background: none; min-width: 20px; height: 4px; padding: 0; border-radius: 2px; background: var(--primary); }

.grid-wrap { overflow: auto; max-height: min(74vh, 980px); border: 1px solid var(--line); border-radius: 12px; background: var(--surface); overscroll-behavior: contain; }
table.grid { border-collapse: separate; border-spacing: 0; font-size: 13px; }
.grid th, .grid td { padding: 0; }
.grid thead th { position: sticky; top: 0; z-index: 3; background: var(--surface); border-bottom: 1px solid var(--line); }
.grid .nm { position: sticky; left: 0; z-index: 2; background: var(--surface); width: 184px; min-width: 184px; max-width: 184px; text-align: left; padding: 3px 12px; border-right: 1px solid var(--line); font-weight: 400; }
.grid thead .nm { z-index: 4; vertical-align: bottom; padding-bottom: 8px; font-size: 12.5px; color: var(--ink-2); font-weight: 700; }
.nm-n { display: block; font-weight: 700; font-size: 13.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; line-height: 1.25; }
.nm-s { display: block; font-size: 11.5px; color: var(--ink-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; line-height: 1.25; }
.dh { width: 32px; min-width: 32px; text-align: center; padding: 8px 0 6px !important; position: relative; }
.dh .dn { display: block; font-weight: 800; font-size: 13.5px; line-height: 1.1; }
.dh .dw { display: block; font-size: 10.5px; color: var(--ink-3); font-weight: 700; }
.grid thead th.wk { background: var(--wkcol); }
.grid thead th.fs::before { content: ""; position: absolute; left: 4px; right: 4px; top: 0; height: 4px; border-radius: 0 0 3px 3px; background: var(--primary); }
.grid thead th.hol { background: var(--ph); color: var(--ph-ink); }
.grid thead th.hol .dw { color: var(--ph-ink); }
.grid td.c { padding: 1px; border-bottom: 1px solid var(--line-2); }
.grid td.c.wk { background: var(--wkcol); }
.grid td.c button { all: unset; box-sizing: border-box; display: grid; place-items: center; width: 30px; height: 28px; font-size: 10px; font-weight: 800; letter-spacing: .02em; cursor: pointer; border-radius: 5px; }
.grid td.c button:focus-visible { outline: 2px solid var(--focus); outline-offset: 0; }
.grid td.c button:disabled { cursor: default; }
.grid td.c.kG button { background: var(--work); }
.grid td.c.wk.kG button { background: color-mix(in srgb, var(--work) 55%, var(--wkcol)); }
.grid td.c.kG button:hover { box-shadow: inset 0 0 0 2px var(--primary); }
.grid td.c.kO button { background: var(--wo); color: var(--wo-ink); }
.grid td.c.kO button:hover { box-shadow: inset 0 0 0 2px var(--wo-ink); }
.grid td.c.kH button { background: var(--ph); color: var(--ph-ink); }
.grid td.c.kL button { background: var(--pl); color: var(--pl-ink); }
.grid tbody tr:hover .nm { background: var(--surface-2); }
.grid .tot { text-align: center; min-width: 42px; font-weight: 700; font-size: 13px; border-bottom: 1px solid var(--line-2); color: var(--ink-2); padding: 0 4px; }
.grid thead .tot { font-size: 11.5px; color: var(--ink-2); vertical-align: bottom; padding-bottom: 8px !important; }
.grid .tot.first { border-left: 1px solid var(--line); }
.grid .tot.strong { color: var(--ink); }
.grid .tot.bad { color: var(--bad); background: var(--bad-soft); }
.grid tr.grp th { position: sticky; left: 0; z-index: 2; background: var(--surface-2); text-align: left; padding: 10px 12px 8px; font-size: 13px; font-weight: 800; border-bottom: 1px solid var(--line); border-top: 1px solid var(--line); }
.grid tr.grp td { background: var(--surface-2); border-bottom: 1px solid var(--line); border-top: 1px solid var(--line); }
.grid tr.grp .grp-sub { font-weight: 400; color: var(--ink-2); margin-left: 6px; }
.grid tr.str .nm { background: var(--surface-2); }
.grid tr.str th { font-size: 12.5px; font-weight: 700; color: var(--ink-2); padding: 6px 12px; }
.grid td.s { text-align: center; font-size: 11.5px; font-weight: 800; color: var(--ink-2); background: var(--surface-2); height: 30px; border-bottom: 1px solid var(--line); }
.grid td.s.full { color: var(--primary); }
.grid td.s.low { background: var(--bad-soft); color: var(--bad); }
.grid td.s.na { color: var(--ink-3); font-weight: 400; }
.grid td.s-pad { background: var(--surface-2); border-bottom: 1px solid var(--line); }
.flash, .grid tr.flash .nm { animation: flash 1.8s ease-out; }
@keyframes flash { 0%, 40% { box-shadow: inset 0 0 0 2px var(--focus); background-color: color-mix(in srgb, var(--focus) 18%, transparent); } 100% { box-shadow: none; } }
.grid-foot { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-top: 10px; font-size: 13px; color: var(--ink-2); }

/* ---------- team ---------- */
.team-table input.input { width: 100%; }
.team-table td.id-col { width: 110px; }
.team-table td.team-col { width: 110px; }
.daypick { display: inline-flex; gap: 3px; flex-wrap: wrap; }
.daypick button { border: 1px solid var(--line); background: var(--surface); border-radius: 7px; min-width: 34px; height: 30px; padding: 0 4px; font-size: 12.5px; font-weight: 700; color: var(--ink-2); cursor: pointer; }
.daypick button:hover { border-color: var(--ink-3); color: var(--ink); }
.daypick button[aria-pressed="true"] { background: var(--wo); border-color: var(--wo); color: var(--wo-ink); }
.daypick.teal button[aria-pressed="true"] { background: var(--primary); border-color: var(--primary); color: var(--primary-ink); }
.daypick button.blocked:not([aria-pressed="true"]) { color: var(--ink-3); border-style: dashed; }
.daypick button:disabled { cursor: not-allowed; opacity: .55; }
.pref-warn { display: block; font-size: 12px; color: var(--warn); margin-top: 4px; }
details.more { margin-top: 18px; }
details.more summary { cursor: pointer; font-weight: 700; color: var(--primary); }
details.more textarea { width: 100%; min-height: 120px; margin-top: 10px; font-family: inherit; }

/* ---------- rules ---------- */
.rule-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px; }
.rule { display: grid; grid-template-columns: auto 1fr auto; gap: 14px; align-items: start; padding: 14px 14px 14px 16px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); }
.rule.off { background: var(--surface-2); }
.rule.off .rule-title { color: var(--ink-3); }
.rule-title { font-weight: 800; font-size: 16px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; line-height: 1.3; }
.rule-help { margin: 4px 0 0; font-size: 13.5px; color: var(--ink-2); max-width: 75ch; }
.rule-params { display: flex; flex-wrap: wrap; gap: 10px 20px; margin-top: 10px; align-items: center; }
.rule-params .lab { font-size: 12.5px; font-weight: 700; color: var(--ink-2); display: inline-flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.switch { position: relative; width: 44px; height: 26px; flex: none; margin-top: 1px; }
.switch input { position: absolute; inset: 0; opacity: 0; margin: 0; cursor: pointer; z-index: 1; }
.switch span { position: absolute; inset: 0; border-radius: 999px; background: var(--line); transition: background .15s; }
.switch span::after { content: ""; position: absolute; top: 3px; left: 3px; width: 20px; height: 20px; border-radius: 50%; background: #fff; box-shadow: 0 1px 2px rgba(0,0,0,.3); transition: transform .15s; }
.switch input:checked + span { background: var(--primary); }
.switch input:checked + span::after { transform: translateX(18px); }
.switch input:focus-visible + span { outline: 2px solid var(--focus); outline-offset: 2px; }
.switch input:disabled { cursor: not-allowed; }
.rule-params .lab.check { gap: 8px; cursor: pointer; font-size: 13.5px; color: var(--ink); }
.rule-params .lab.check input { width: 18px; height: 18px; accent-color: var(--primary); margin: 0; }
.file-btn { position: relative; }
.file-btn:focus-within { outline: 2px solid var(--focus); outline-offset: 2px; }
.file-btn[aria-disabled="true"] { opacity: .5; pointer-events: none; }
.rule-params .ex-row { flex-basis: 100%; gap: 8px; }
.ex-chip { display: inline-flex; align-items: center; gap: 6px; padding: 3px 4px 3px 10px; border-radius: 999px; background: var(--wo); color: var(--wo-ink); font-size: 13px; font-weight: 700; }
.ex-chip .muted { color: var(--wo-ink); opacity: .7; font-weight: 600; font-size: 11.5px; }
.ex-chip button { border: 0; background: rgba(0,0,0,.08); color: inherit; width: 22px; height: 22px; border-radius: 50%; cursor: pointer; font-size: 14px; line-height: 1; display: grid; place-items: center; }
.ex-chip button:hover { background: rgba(0,0,0,.18); }
select.input.ex-add { min-height: 32px; padding: 4px 8px; font-size: 13.5px; }
.ex-note { display: block; font-size: 12px; color: var(--ink-2); margin-top: 4px; }
.add-rule { margin-top: 22px; padding: 18px; border-radius: 12px; border: 1px dashed var(--ink-3); }
.two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; margin-top: 18px; }

/* ---------- dialog & toast ---------- */
dialog { border: 1px solid var(--line); border-radius: 14px; padding: 0; background: var(--surface); color: var(--ink); max-width: min(560px, calc(100vw - 32px)); width: 100%; box-shadow: 0 30px 80px -20px rgba(0,0,0,.45); }
dialog::backdrop { background: rgba(10, 25, 30, .45); }
.dlg { padding: 22px; }
.dlg h2 { margin: 0 0 8px; font-size: 20px; }
.dlg p { margin: 0 0 12px; color: var(--ink-2); }
.dlg textarea { width: 100%; min-height: 200px; font-size: 12px; font-family: ui-monospace, Menlo, Consolas, monospace; border: 1px solid var(--line); border-radius: 8px; padding: 8px; background: var(--surface-2); color: var(--ink); }
.dlg-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 16px; flex-wrap: wrap; }
#toast { position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%) translateY(20px); background: var(--ink); color: var(--surface); padding: 11px 18px; border-radius: 10px; font-weight: 700; font-size: 14.5px; opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s; z-index: 50; max-width: calc(100vw - 32px); }
#toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
.busy { display: inline-flex; align-items: center; gap: 10px; font-weight: 700; color: var(--primary); }
.spinner { width: 18px; height: 18px; border-radius: 50%; border: 3px solid var(--primary-soft); border-top-color: var(--primary); animation: spin .8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

@media (max-width: 900px) {
  .month-body { grid-template-columns: 1fr; }
  .ready { grid-template-columns: 1fr; }
  .two-col { grid-template-columns: 1fr; }
}
@media (max-width: 720px) {
  body { font-size: 15px; }
  .steps { grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; }
  .step { flex-direction: column; align-items: flex-start; gap: 6px; padding: 10px; }
  .step-sub { display: none; }
  .step-label { font-size: 12.5px; }
  .grid .nm { width: 128px; min-width: 128px; max-width: 128px; padding: 3px 8px; }
  .rule { grid-template-columns: auto 1fr; }
  .rule > .icon-btn { grid-column: 2; justify-self: start; }
  .month-hero { gap: 10px; }
  .month-name { font-size: 30px; flex: 0 1 auto; min-width: 0; }
  .month-jump { margin-left: 0; flex-basis: 100%; order: 3; }
  .brand-row .sync { order: 3; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; }
  .flash, .grid tr.flash .nm { animation: none; box-shadow: inset 0 0 0 2px var(--focus); }
}
</style>

<body>
<header class="appbar">
  <div class="appbar-in">
    <div class="brand-row">
      <div class="brand">
        <svg class="brand-mark" viewBox="0 0 34 34" aria-hidden="true">
          <rect x="1" y="1" width="32" height="32" rx="8" fill="var(--primary)"/>
          <g fill="var(--primary-ink)" opacity=".92">
            <rect x="7" y="7" width="5" height="5" rx="1.2"/><rect x="14.5" y="7" width="5" height="5" rx="1.2"/><rect x="22" y="7" width="5" height="5" rx="1.2"/>
            <rect x="7" y="14.5" width="5" height="5" rx="1.2"/><rect x="22" y="14.5" width="5" height="5" rx="1.2"/>
            <rect x="7" y="22" width="5" height="5" rx="1.2"/><rect x="14.5" y="22" width="5" height="5" rx="1.2"/><rect x="22" y="22" width="5" height="5" rx="1.2"/>
          </g>
          <rect x="14.5" y="14.5" width="5" height="5" rx="1.2" fill="var(--wo)"/>
        </svg>
        <div><h1>Doctor duty roster</h1><p id="shift-line">RM and CMU doctor teams</p></div>
      </div>
      <span id="sync" class="sync local">Saved in this browser</span>
    </div>
    <nav class="tabs" role="tablist" aria-label="Sections">
      <button class="tab" role="tab" data-act="tab" data-tab="roster" aria-selected="true">Roster</button>
      <button class="tab" role="tab" data-act="tab" data-tab="team" aria-selected="false">Doctors<span class="count"></span></button>
      <button class="tab" role="tab" data-act="tab" data-tab="rules" aria-selected="false">Rules<span class="count"></span></button>
      <button class="tab" role="tab" data-act="tab" data-tab="history" aria-selected="false">History<span class="count"></span></button>
    </nav>
  </div>
</header>
<main id="app" aria-live="polite"></main>
<div id="toast" role="status" aria-live="polite"></div>
<dialog id="dlg"></dialog>
<script>
'use strict';
/* ===== Rostering engine (pure functions) ===== */
const TEAMS = ['RM', 'CMU'];
const DOW_SHORT = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
const DOW_LONG = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
const DOW_ORDER = [1, 2, 3, 4, 5, 6, 0];
const MONTHS = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
const MON_SHORT = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];

const RULE_TYPES = {
  full_days: { title: 'Full strength on set weekdays', kind: 'must', params: ['days', 'teams', 'except'],
    help: 'Every doctor in the team is on duty and no week-offs are placed on these days, apart from any doctors listed under “Doesn’t apply to”, who can be given week-offs here.' },
  full_last_day: { title: 'Full strength on the last date of the month', kind: 'must', params: ['teams', 'except'],
    help: 'The last date (30th, 31st, or 28th/29th in February) is fully staffed.' },
  full_dates: { title: 'Full strength on set dates', kind: 'must', params: ['dates', 'teams', 'except'],
    help: 'Dates of the month, such as 1, 15. Useful for closings, audits or campaign days.' },
  min_days: { title: 'Minimum strength on set weekdays', kind: 'must', params: ['days', 'pct', 'teams', 'fill'],
    help: 'Counted separately for each team and rounded up: 75% means 15 of 20 RM and 3 of 4 CMU on duty. With “Give the rest week-offs” ticked, the remaining share (5 RM and 1 CMU at 75%) is given week-offs on these days wherever the other rules allow, without cutting anyone’s duty days. Also tick “Allow an extra week-off” to fill every slot, even if a few doctors then work one day less.' },
  max_streak: { title: 'Maximum working days in a row', kind: 'must', params: ['n'],
    help: 'Checked across the month boundary when last month’s roster is saved in history.' },
  max_work: { title: 'Maximum working days in a month', kind: 'must', params: ['n'],
    help: 'Week-offs are added until every doctor is at or under this number.' },
  min_offs: { title: 'Minimum week-offs in a month', kind: 'must', params: ['n'],
    help: 'Guaranteed week-offs on top of public holidays and planned leave.' },
  max_off_run: { title: 'Maximum week-offs in a row', kind: 'must', params: ['n'],
    help: 'Stops week-offs from being bunched together.' },
  holiday_off: { title: 'Public holidays are a complete off', kind: 'must', params: [], single: true,
    help: 'Both teams are off on every holiday added for the month. A holiday takes priority over full-strength days.' },
  pref_off: { title: 'Honour preferred week-off days', kind: 'try', params: [], single: true,
    help: 'Week-offs go on each doctor’s preferred days whenever the must rules allow.' },
  weekend_fair: { title: 'Weekend offs for everyone', kind: 'try', params: ['n'], single: true,
    help: 'Each doctor gets at least this many Saturday or Sunday offs where the weekend minimum allows.' },
};

const N_DEFAULTS = { max_streak: 7, max_work: 26, min_offs: 4, max_off_run: 2, weekend_fair: 1 };

function defaultParams(type) {
  const t = RULE_TYPES[type];
  const p = {};
  for (const k of t.params) {
    if (k === 'days') p.days = type === 'full_days' ? [1, 5] : [2, 3, 4];
    if (k === 'teams') p.teams = ['RM', 'CMU'];
    if (k === 'pct') p.pct = 60;
    if (k === 'n') p.n = N_DEFAULTS[type] || 1;
    if (k === 'dates') p.dates = [1];
    if (k === 'except') p.except = [];
    if (k === 'fill') { p.fill = false; p.extra = false; }
  }
  return p;
}

function defaultRules() {
  return [
    { id: 'rule_monfri', type: 'full_days', enabled: true, params: { days: [1, 5], teams: ['RM', 'CMU'] } },
    { id: 'rule_lastday', type: 'full_last_day', enabled: true, params: { teams: ['RM', 'CMU'] } },
    { id: 'rule_streak', type: 'max_streak', enabled: true, params: { n: 7 } },
    { id: 'rule_holiday', type: 'holiday_off', enabled: true, params: {} },
    { id: 'rule_pref', type: 'pref_off', enabled: true, params: {} },
    { id: 'rule_weekend', type: 'min_days', enabled: true, params: { days: [6, 0], pct: 75, teams: ['RM', 'CMU'], fill: true, extra: false } },
    { id: 'rule_cap', type: 'max_work', enabled: true, params: { n: 26 } },
    { id: 'rule_midweek', type: 'min_days', enabled: false, params: { days: [2, 3, 4], pct: 60, teams: ['RM', 'CMU'], fill: false, extra: false } },
  ];
}

function defaultResources() {
  const out = [];
  for (let i = 1; i <= 20; i++) out.push({ id: 'res_rm' + pad(i), empId: 'RM' + pad(i), name: 'RM Doctor ' + pad(i), team: 'RM', pref: [] });
  for (let i = 1; i <= 4; i++) out.push({ id: 'res_cmu' + pad(i), empId: 'CMU' + pad(i), name: 'CMU Doctor ' + pad(i), team: 'CMU', pref: [] });
  return out;
}

/* ---------- date helpers ---------- */
function pad(n) { return String(n).padStart(2, '0'); }
function parseYM(s) { const [y, m] = String(s).split('-').map(Number); return { y, m: m - 1 }; }
function ymStr(y, m) { const d = new Date(y, m, 1); return d.getFullYear() + '-' + pad(d.getMonth() + 1); }
function addMonths(s, k) { const { y, m } = parseYM(s); return ymStr(y, m + k); }
function daysIn(y, m) { return new Date(y, m + 1, 0).getDate(); }
function isoDate(y, m, d) { return y + '-' + pad(m + 1) + '-' + pad(d); }
function isWeekend(dow) { return dow === 0 || dow === 6; }
function monthInfo(month) {
  const { y, m } = parseYM(month);
  const D = daysIn(y, m);
  const dows = [];
  for (let i = 0; i < D; i++) dows.push(new Date(y, m, i + 1).getDay());
  return { y, m, D, dows, first: isoDate(y, m, 1), last: isoDate(y, m, D) };
}
function monthLabel(month) { const { y, m } = parseYM(month); return MONTHS[m] + ' ' + y; }

function mulberry32(a) {
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
function hashStr(s) { let h = 2166136261; for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; }

/* ---------- rules ---------- */
// memberIds (optional): the team's doctor ids, so per-doctor exemptions can be counted.
function compileRules(rules, team, N, D, dows, memberIds) {
  const C = { locked: Array(D).fill(false), req: Array(D).fill(0), fill: Array(D).fill(false), fillExtra: false, maxStreak: Infinity, maxWork: Infinity,
    minOffs: 0, maxOffRun: Infinity, holidayOff: false, prefOn: false, weekendFair: 0, lockedBy: Array(D).fill(null),
    exempt: Array.from({ length: D }, () => null) };
  const inTeamSet = memberIds ? new Set(memberIds) : null;
  // A doctor is free on a full-strength day only if every rule locking that day exempts them.
  const lock = (d, r) => {
    const ex = new Set((r.params.except || []).filter(id => !inTeamSet || inTeamSet.has(id)));
    if (!C.locked[d]) { C.locked[d] = true; C.lockedBy[d] = r.id; C.exempt[d] = ex; }
    else C.exempt[d] = new Set([...C.exempt[d]].filter(id => ex.has(id)));
  };
  for (const r of rules) {
    if (!r.enabled || !RULE_TYPES[r.type]) continue;
    const p = r.params || {};
    const inTeam = !p.teams || p.teams.includes(team);
    const num = (v, lo) => Math.max(lo, Math.round(+v || 0));
    switch (r.type) {
      case 'full_days':
        if (inTeam) for (let d = 0; d < D; d++) if ((p.days || []).includes(dows[d])) lock(d, r);
        break;
      case 'full_last_day':
        if (inTeam) lock(D - 1, r);
        break;
      case 'full_dates':
        if (inTeam) for (const x of (p.dates || [])) if (x >= 1 && x <= D) lock(x - 1, r);
        break;
      case 'min_days':
        if (inTeam) {
          const need = Math.min(N, Math.ceil((+p.pct || 0) * N / 100 - 1e-9));
          for (let d = 0; d < D; d++) if ((p.days || []).includes(dows[d])) { C.req[d] = Math.max(C.req[d], need); if (p.fill) C.fill[d] = true; }
          if (p.fill && p.extra) C.fillExtra = true;
        }
        break;
      case 'max_streak': C.maxStreak = Math.min(C.maxStreak, num(p.n, 1)); break;
      case 'max_work': C.maxWork = Math.min(C.maxWork, num(p.n, 0)); break;
      case 'min_offs': C.minOffs = Math.max(C.minOffs, num(p.n, 0)); break;
      case 'max_off_run': C.maxOffRun = Math.min(C.maxOffRun, num(p.n, 1)); break;
      case 'holiday_off': C.holidayOff = true; break;
      case 'pref_off': C.prefOn = true; break;
      case 'weekend_fair': C.weekendFair = Math.max(C.weekendFair, num(p.n, 0)); break;
    }
  }
  C.minReq = C.req.slice(); // minimum-strength requirements before full-strength days are applied
  for (let d = 0; d < D; d++) {
    if (!C.locked[d]) continue;
    C.req[d] = Math.max(C.req[d], N - C.exempt[d].size);
    C.fill[d] = false;
  }
  C.lockedFor = (id, d) => C.locked[d] && !C.exempt[d].has(id);
  return C;
}

function leaveIdx(leaves, resId, info) {
  const set = new Set();
  for (const l of leaves) {
    if (l.resId !== resId || !l.from || !l.to) continue;
    if (l.to < info.first || l.from > info.last) continue;
    for (let d = 1; d <= info.D; d++) {
      const iso = isoDate(info.y, info.m, d);
      if (iso >= l.from && iso <= l.to) set.add(d - 1);
    }
  }
  return set;
}

function carryFrom(savedDoc) {
  const out = {};
  if (!savedDoc || !savedDoc.codes) return out;
  for (const id in savedDoc.codes) {
    const s = savedDoc.codes[id] || '';
    let n = 0;
    for (let i = s.length - 1; i >= 0 && s[i] === 'G'; i--) n++;
    out[id] = n;
  }
  return out;
}

/* ---------- generation ---------- */
function generateRoster({ month, resources, rules, holidays, leaves, saved, seed = 1, fillWeight, wkWeight, xoff }) {
  const info = monthInfo(month);
  const { D, dows } = info;
  const holidayOff = rules.some(r => r.enabled && r.type === 'holiday_off');
  const hols = holidays.filter(h => h.date && h.date.slice(0, 7) === month).sort((a, b) => (a.date < b.date ? -1 : 1));
  const holIdx = new Set(holidayOff ? hols.map(h => +h.date.slice(8, 10) - 1) : []);
  const people = resources.map(r => ({ id: r.id, empId: r.empId || '', name: r.name || '', team: r.team, pref: [...(r.pref || [])] }));
  const prevSaved = saved ? saved[addMonths(month, -1)] : null;
  const carry = carryFrom(prevSaved);
  const codes = {};
  const rng = mulberry32((hashStr(month) ^ Math.imul(seed, 2654435761)) >>> 0);
  const nextM = addMonths(month, 1);
  const nextInfo = monthInfo(nextM);
  const nextHol = new Set(holidayOff ? holidays.filter(h => h.date && h.date.slice(0, 7) === nextM).map(h => +h.date.slice(8, 10) - 1) : []);
  for (const team of TEAMS) {
    const members = people.filter(p => p.team === team);
    if (members.length) solveTeam(team, members, { info, holIdx, rules, carry, codes, rng, seed, leaves, nextInfo, nextHol, fillWeight, wkWeight, xoff });
  }
  return {
    month, D, dows, people, codes, carry, carryFrom: prevSaved ? addMonths(month, -1) : null,
    holidays: hols.map(h => ({ date: h.date, name: h.name })), rules: JSON.parse(JSON.stringify(rules)),
    seed, generatedAt: new Date().toISOString(),
  };
}

function solveTeam(team, members, ctx) {
  const { info, holIdx, rules, carry, codes, rng, seed, leaves, nextInfo, nextHol } = ctx;
  const { D, dows } = info;
  const N = members.length;
  const ids = members.map(p => p.id);
  const C = compileRules(rules, team, N, D, dows, ids);
  // Leave room for next month: a doctor finishing on a long streak must be able to take
  // an off early next month. Find the first day next month that is open (or a holiday).
  let tailSoft = Infinity, tailHard = Infinity;
  const Wcap = []; // Wcap[L]: offs next month can give, early enough, to doctors finishing on L+ days
  if (isFinite(C.maxStreak) && nextInfo) {
    const Cn = compileRules(rules, team, N, nextInfo.D, nextInfo.dows, ids);
    let f = 0, h = 0;
    while (f < nextInfo.D && f < C.maxStreak && !nextHol.has(f) && (Cn.locked[f] || Cn.req[f] > 0)) f++;
    while (h < nextInfo.D && h < C.maxStreak && !nextHol.has(h) && Cn.locked[h]) h++;
    tailSoft = Math.max(1, C.maxStreak - f);
    tailHard = Math.max(1, C.maxStreak - h);
    const allow = d => (d >= nextInfo.D ? N : nextHol.has(d) ? Infinity : Cn.locked[d] ? Cn.exempt[d].size : Math.max(0, N - Cn.req[d]));
    for (let L = 0; L <= C.maxStreak + 1; L++) {
      let w = 0;
      for (let d = 0; d <= C.maxStreak - L - 1; d++) w += allow(d);
      Wcap[L] = w;
    }
  }
  const tailOf = p => { const g = codes[p.id]; let n = 0, i = D - 1; while (i >= 0 && g[i] === 'G') { n++; i--; } if (i < 0) n += carry[p.id] || 0; return n; };
  const tailCounts = skip => {
    const cnt = Array(C.maxStreak + 3).fill(0);
    for (const q of members) { if (q === skip) continue; const t = Math.min(tailOf(q), C.maxStreak + 1); for (let L = 1; L <= t; L++) cnt[L]++; }
    return cnt;
  };
  // Marginal cost of one doctor finishing on a t-day streak, given everyone else.
  const tailPen = (t, cnt) => {
    if (!isFinite(tailSoft) || t <= 0) return 0;
    let c = t > tailSoft ? 15 * (t - tailSoft) : 0;
    const top = Math.min(t, C.maxStreak + 1);
    for (let L = 1; L <= top; L++) if ((cnt ? cnt[L] : 0) + 1 > Wcap[L]) c += 600;
    return c;
  };

  for (const p of members) {
    const lv = leaveIdx(leaves, p.id, info);
    const g = Array(D);
    for (let d = 0; d < D; d++) g[d] = holIdx.has(d) ? 'H' : lv.has(d) ? 'L' : 'G';
    codes[p.id] = g;
  }
  const workCnt = Array(D).fill(0), offCnt = Array(D).fill(0);
  for (const p of members) for (let d = 0; d < D; d++) if (codes[p.id][d] === 'G') workCnt[d]++;
  const wk = {}, jit = {}, target = {};
  for (const p of members) {
    wk[p.id] = 0;
    jit[p.id] = Array.from({ length: D }, () => rng() * 0.8);
    const workable = codes[p.id].filter(c => c === 'G').length;
    const byCap = isFinite(C.maxWork) ? workable - C.maxWork : 0;
    target[p.id] = Math.min(workable, Math.max(0, byCap, C.minOffs));
  }
  // Preferred days that can never be used (every such weekday is full strength) are ignored.
  const dayIdx = w => dows.map((x, i) => (x === w ? i : -1)).filter(i => i >= 0);
  const prefCache = {};
  const pref = p => (C.prefOn ? (prefCache[p.id] || (prefCache[p.id] = p.pref.filter(w => { const ds = dayIdx(w); return !(ds.length && ds.every(i => C.lockedFor(p.id, i))); }))) : []);
  const setOff = (p, d) => { codes[p.id][d] = 'O'; workCnt[d]--; offCnt[d]++; if (isWeekend(dows[d])) wk[p.id]++; };
  const clearOff = (p, d) => { codes[p.id][d] = 'G'; workCnt[d]++; offCnt[d]--; if (isWeekend(dows[d])) wk[p.id]--; };

  // Each doctor's week-offs are planned optimally (dynamic programming over the month)
  // while everyone else is held fixed; repeated sweeps settle the whole team.
  const R = isFinite(C.maxStreak) ? C.maxStreak : 1;
  const Q = isFinite(C.maxOffRun) ? C.maxOffRun : 1;
  const S = 1 + R + Q; // 0 = neutral, 1..R = working run, R+1..R+Q = off run
  const EXTRA = 7;
  const FILL = typeof ctx.fillWeight === 'number' ? ctx.fillWeight : 45;
  const XOFF = typeof ctx.xoff === 'number' ? ctx.xoff : C.fillExtra ? 60 : 150; // cost of a week-off beyond what the working-day cap needs
  const PREF = 70; // a stated preference outranks filling the weekend allowance
  const WKV = typeof ctx.wkWeight === 'number' ? ctx.wkWeight : 10; // weekend-off fairness
  const wkDays = dows.filter(isWeekend).length;

  function plan(p) {
    for (let d = 0; d < D; d++) if (codes[p.id][d] === 'O') clearOff(p, d);
    const g = codes[p.id];
    const T = target[p.id];
    const K = T + EXTRA + 1;
    const W = Math.min(K, wkDays + 1);
    const pf = pref(p);
    const allowed = Array(D), dayCost = Array(D);
    for (let d = 0; d < D; d++) {
      allowed[d] = g[d] === 'G' && !C.lockedFor(p.id, d) && workCnt[d] - 1 >= C.req[d];
      dayCost[d] = (pf.length && !pf.includes(dows[d]) ? PREF : 0) + (2 * offCnt[d] + 1) * (20 / N) + jit[p.id][d]
        - (C.fill[d] ? FILL : 0);
    }
    const SZ = S * K * W;
    const idx = (s, k, w) => (s * K + k) * W + w;
    let cur = new Float64Array(SZ).fill(Infinity);
    const c0 = carry[p.id] || 0;
    cur[idx(c0 > 0 ? Math.min(c0, R) : 0, 0, 0)] = 0;
    const back = [];
    for (let d = 0; d < D; d++) {
      const nxt = new Float64Array(SZ).fill(Infinity);
      const bp = new Int32Array(SZ).fill(-1);
      const c = g[d];
      const isW = isWeekend(dows[d]);
      for (let s = 0; s < S; s++) for (let k = 0; k < K; k++) for (let w = 0; w < W; w++) {
        const i = idx(s, k, w);
        const v = cur[i];
        if (v === Infinity) continue;
        if (c !== 'G') {
          const j = idx(0, k, w);
          if (v < nxt[j]) { nxt[j] = v; bp[j] = i * 2; }
          continue;
        }
        let r = s >= 1 && s <= R ? s + 1 : 1, pen = 0;
        if (r > R) { r = R; if (isFinite(C.maxStreak)) pen = 1000; }
        const jw = idx(r, k, w);
        if (v + pen < nxt[jw]) { nxt[jw] = v + pen; bp[jw] = i * 2; }
        if (allowed[d] && k + 1 < K) {
          const inOff = s > R;
          let o = inOff ? s - R + 1 : 1, ok = true;
          if (o > Q) { if (isFinite(C.maxOffRun)) ok = false; else o = Q; }
          const w2 = w + (isW ? 1 : 0);
          if (ok && w2 < W) {
            const adj = inOff && dows[d] !== 0 ? 2 : 0;
            const jo = idx(R + o, k + 1, w2);
            const nv = v + dayCost[d] + adj;
            if (nv < nxt[jo]) { nxt[jo] = nv; bp[jo] = i * 2 + 1; }
          }
        }
      }
      back.push(bp);
      cur = nxt;
    }
    const tailCnt = isFinite(tailSoft) ? tailCounts(p) : null;
    const others = members.filter(q => q !== p).map(q => wk[q.id]);
    const sumO = others.reduce((a, x) => a + x, 0);
    const V = w => {
      const mu = (sumO + w) / N;
      let t = (w - mu) * (w - mu);
      for (const x of others) t += (x - mu) * (x - mu);
      return (pf.length ? 0 : WKV) * t + (C.weekendFair > 0 && w < C.weekendFair ? 15 * (C.weekendFair - w) : 0);
    };
    let best = -1, bv = Infinity;
    for (let i = 0; i < SZ; i++) {
      if (cur[i] === Infinity) continue;
      const w = i % W, k = Math.floor(i / W) % K, st = Math.floor(i / (W * K));
      const tail = st >= 1 && st <= R ? st : 0;
      const tot = cur[i] + V(w) + (k >= T ? XOFF * (k - T) : 500 * (T - k)) + tailPen(tail, tailCnt);
      if (tot < bv) { bv = tot; best = i; }
    }
    if (best < 0) return;
    let i = best;
    for (let d = D - 1; d >= 0; d--) {
      const b = back[d][i];
      if (b < 0) break;
      if (b & 1) setOff(p, d);
      i = b >> 1;
    }
  }

  const rot = members.slice().sort((a, b) => ((members.indexOf(a) + seed * 7) % N) - ((members.indexOf(b) + seed * 7) % N));
  rot.sort((a, b) => (pref(b).length > 0) - (pref(a).length > 0));
  for (const p of rot) plan(p);
  for (let sweep = 0; sweep < 3; sweep++) {
    const order = members.slice();
    for (let i = order.length - 1; i > 0; i--) { const j = Math.floor(rng() * (i + 1)); [order[i], order[j]] = [order[j], order[i]]; }
    for (const p of order) plan(p);
  }

  // Hand weekend slots from doctors with many weekend offs to those with few.
  const teamCost = () => {
    let c = 0;
    const avg = members.reduce((a, p) => a + wk[p.id], 0) / N;
    for (const p of members) {
      const dv = wk[p.id] - avg; c += (pref(p).length ? 0 : WKV) * dv * dv;
      if (C.weekendFair > 0 && wk[p.id] < C.weekendFair) c += 15 * (C.weekendFair - wk[p.id]);
      const pf = pref(p), g = codes[p.id];
      let k = 0;
      for (let d = 0; d < D; d++) {
        if (g[d] !== 'O') continue;
        k++;
        if (pf.length && !pf.includes(dows[d])) c += PREF;
        if (d > 0 && g[d - 1] === 'O' && dows[d] !== 0) c += 2;
      }
      const T = target[p.id];
      c += k >= T ? XOFF * (k - T) : 500 * (T - k);
      if (isFinite(C.maxStreak)) {
        const runs = workRuns(g, carry[p.id] || 0);
        for (const run of runs) if (run.len > C.maxStreak) c += 1000 * (run.len - C.maxStreak);
      }
    }
    for (let d = 0; d < D; d++) {
      c += offCnt[d] * offCnt[d] * (20 / N);
      if (C.fill[d]) c += FILL * Math.max(0, workCnt[d] - C.req[d]);
    }
    if (isFinite(tailSoft)) {
      const cnt = tailCounts(null);
      for (const q of members) { const t = tailOf(q); if (t > tailSoft) c += 15 * (t - tailSoft); }
      for (let L = 1; L <= C.maxStreak + 1; L++) c += 600 * Math.max(0, cnt[L] - Wcap[L]);
    }
    return c;
  };
  const snap = () => members.map(p => codes[p.id].slice());
  const restore = sn => {
    members.forEach((p, i) => { codes[p.id] = sn[i]; });
    workCnt.fill(0); offCnt.fill(0);
    for (const p of members) {
      wk[p.id] = 0;
      for (let d = 0; d < D; d++) {
        const c = codes[p.id][d];
        if (c === 'G') workCnt[d]++;
        else if (c === 'O') { offCnt[d]++; if (isWeekend(dows[d])) wk[p.id]++; }
      }
    }
  };
  // Repair: if a doctor still has an over-long streak or too few week-offs because the
  // day's quota is used up, take the slot from a teammate and re-plan both.
  const troubled = p => {
    const runs = workRuns(codes[p.id], carry[p.id] || 0);
    const bad = isFinite(C.maxStreak) ? runs.filter(r => r.len > C.maxStreak) : [];
    const last = runs[runs.length - 1];
    if (last && last.b === D - 1 && last.len > tailHard && !bad.includes(last)) bad.push({ a: Math.max(last.a, D - tailHard - 1), b: D - 1 });
    const offs = codes[p.id].filter(c => c === 'O').length;
    return { bad, short: offs < target[p.id] };
  };
  let repairs = 0;
  for (let iter = 0; iter < 40 && repairs < 400; iter++) {
    let improved = false;
    repair:
    for (const p of members) {
      const t = troubled(p);
      if (!t.bad.length && !t.short) continue;
      const days = [];
      if (t.bad.length) for (const r of t.bad) for (let d = r.a; d <= r.b; d++) days.push(d);
      else for (let d = 0; d < D; d++) days.push(d);
      for (const d of days) {
        if (codes[p.id][d] !== 'G' || C.lockedFor(p.id, d)) continue;
        for (const q of members) {
          if (q === p || codes[q.id][d] !== 'O') continue;
          if (++repairs > 400) break repair;
          const sn = snap(), base = teamCost();
          clearOff(q, d);
          plan(p); plan(q);
          if (teamCost() < base - 0.01) { improved = true; break repair; }
          restore(sn);
        }
      }
    }
    if (!improved) break;
  }

  let attempts = 0;
  for (let iter = 0; iter < 30 && attempts < 220; iter++) {
    const asc = members.slice().sort((a, b) => wk[a.id] - wk[b.id]);
    const wantsWeekend = p => pref(p).some(isWeekend);
    const Bs = asc.filter(p => !pref(p).length || wantsWeekend(p)).slice(0, 5);
    const As = asc.slice().reverse().filter(p => !wantsWeekend(p)).slice(0, 8);
    let improved = false;
    search:
    for (const B of Bs) {
      for (const A of As) {
        if (wk[A.id] < wk[B.id] + 2) continue;
        for (let w = 0; w < D; w++) {
          if (!isWeekend(dows[w]) || codes[A.id][w] !== 'O' || codes[B.id][w] !== 'G' || pref(A).includes(dows[w])) continue;
          if (++attempts > 220) break search;
          const sn = snap(), base = teamCost();
          clearOff(A, w);
          plan(B); plan(A);
          if (teamCost() < base - 0.01) { improved = true; break search; }
          restore(sn);
        }
      }
    }
    if (!improved) break;
  }
}

function workRuns(g, carry) {
  const runs = [];
  const D = g.length;
  let i = 0;
  while (i < D) {
    if (g[i] === 'G') {
      const a = i;
      while (i < D && g[i] === 'G') i++;
      const carried = a === 0 ? (carry || 0) : 0;
      runs.push({ a, b: i - 1, len: i - a + carried, carried });
    } else i++;
  }
  return runs;
}

/* ---------- validation ---------- */
function validateRoster(r, nameOf) {
  const { D, dows } = r;
  const name = p => (nameOf ? nameOf(p) : p.name) || p.empId || 'A doctor';
  const rules = r.rules.filter(x => x.enabled && RULE_TYPES[x.type]);
  const has = t => rules.some(x => x.type === t);
  const numOf = (t, fn, init) => rules.filter(x => x.type === t).reduce((a, x) => fn(a, Math.round(+x.params.n || 0)), init);
  const maxStreak = numOf('max_streak', Math.min, Infinity);
  const maxWork = numOf('max_work', Math.min, Infinity);
  const minOffs = numOf('min_offs', Math.max, 0);
  const maxOffRun = numOf('max_off_run', Math.min, Infinity);
  const weekendFair = numOf('weekend_fair', Math.max, 0);
  const holidayOff = has('holiday_off');
  const prefOn = has('pref_off');
  const holMap = {};
  for (const h of r.holidays) holMap[+h.date.slice(8, 10) - 1] = h.name || 'Public holiday';
  const mon = MON_SHORT[parseYM(r.month).m];
  const dayTxt = d => DOW_SHORT[dows[d]] + ' ' + (d + 1);
  const out = { errors: [], warnings: [], notes: [], day: {}, person: {}, req: {} };

  // person stats
  for (const p of r.people) {
    const g = r.codes[p.id];
    if (!g) continue;
    const st = { work: 0, off: 0, leave: 0, hol: 0, wk: 0, prefHit: 0, maxRun: 0, runs: [] };
    for (let d = 0; d < D; d++) {
      const c = g[d];
      if (c === 'G') st.work++;
      else if (c === 'O') { st.off++; if (isWeekend(dows[d])) st.wk++; if (p.pref.includes(dows[d])) st.prefHit++; }
      else if (c === 'L') st.leave++;
      else if (c === 'H') st.hol++;
    }
    st.runs = workRuns(g, r.carry[p.id] || 0);
    st.maxRun = st.runs.reduce((m, x) => Math.max(m, x.len), 0);
    out.person[p.id] = st;
  }

  // day strength by team
  for (const team of TEAMS) {
    const members = r.people.filter(p => p.team === team && r.codes[p.id]);
    if (!members.length) continue;
    const N = members.length;
    const C = compileRules(r.rules, team, N, D, dows, members.map(p => p.id));
    out.req[team] = C;
    const arr = [];
    const groups = {};
    for (let d = 0; d < D; d++) {
      let work = 0, off = 0, leave = 0, exAway = 0, lockedOff = 0, exOff = 0;
      for (const p of members) {
        const c = r.codes[p.id][d];
        const ex = C.locked[d] && C.exempt[d].has(p.id);
        if (c === 'G') work++;
        else if (c === 'O') { off++; if (ex) { exAway++; exOff++; } else lockedOff++; }
        else if (c === 'L') { leave++; if (ex) exAway++; }
      }
      const isHol = holidayOff && holMap[d] !== undefined;
      // On a full-strength day, exempt doctors who are away lower the requirement.
      const req = isHol ? 0 : C.locked[d] ? Math.max(C.minReq[d], N - exAway) : C.req[d];
      const ok = work >= req;
      arr.push({ work, off, leave, N, req, locked: C.locked[d] && !isHol, isHol, ok, exOff });
      if (!ok) {
        const kind = C.locked[d] ? 'full' : 'min';
        const cause = (C.locked[d] ? lockedOff : off) > 0 ? 'offs' : 'leave';
        const key = kind + '|' + cause;
        (groups[key] = groups[key] || []).push(d);
      }
    }
    out.day[team] = arr;
    const list = ds => ds.map(d => dayTxt(d) + ' (' + arr[d].work + '/' + arr[d].req + ')').join(', ');
    if (groups['full|offs']) out.errors.push({ text: team + ' team is below full strength because week-offs fall on ' + list(groups['full|offs']) + '.', days: groups['full|offs'], team });
    if (groups['min|offs']) out.errors.push({ text: team + ' team is below the minimum on ' + list(groups['min|offs']) + '. Move some week-offs to another day.', days: groups['min|offs'], team });
    if (groups['full|leave']) out.warnings.push({ text: team + ' team can’t reach full strength on ' + list(groups['full|leave']) + ' because of planned leave.', days: groups['full|leave'], team });
    if (groups['min|leave']) out.warnings.push({ text: team + ' team is below the minimum on ' + list(groups['min|leave']) + ' because of planned leave.', days: groups['min|leave'], team });
  }

  // per-person rules
  for (const p of r.people) {
    const st = out.person[p.id];
    if (!st) continue;
    const g = r.codes[p.id];
    if (isFinite(maxStreak)) {
      for (const run of st.runs) {
        if (run.len <= maxStreak) continue;
        const range = (run.a + 1) + '–' + (run.b + 1) + ' ' + mon;
        const extra = run.carried ? ', including ' + run.carried + ' carried over from last month' : '';
        out.errors.push({ text: name(p) + ' works ' + run.len + ' days in a row (' + range + extra + ').', days: rangeArr(run.a, run.b), people: [p.id] });
      }
    }
    if (isFinite(maxWork) && st.work > maxWork) out.errors.push({ text: name(p) + ' is on duty ' + st.work + ' days, over the limit of ' + maxWork + '.', people: [p.id] });
    if (minOffs > 0 && st.off < Math.min(minOffs, st.work + st.off)) out.errors.push({ text: name(p) + ' has ' + st.off + ' week-off' + (st.off === 1 ? '' : 's') + ', fewer than the minimum of ' + minOffs + '.', people: [p.id] });
    if (isFinite(maxOffRun)) {
      let run = 0, start = 0;
      for (let d = 0; d <= D; d++) {
        if (d < D && g[d] === 'O') { if (!run) start = d; run++; }
        else { if (run > maxOffRun) out.errors.push({ text: name(p) + ' has ' + run + ' week-offs in a row from ' + dayTxt(start) + '.', days: rangeArr(start, d - 1), people: [p.id] }); run = 0; }
      }
    }
    if (holidayOff) {
      const worked = Object.keys(holMap).map(Number).filter(d => g[d] === 'G' || g[d] === 'O');
      if (worked.length) out.errors.push({ text: name(p) + ' is not marked off on ' + worked.map(d => holMap[d] + ' (' + dayTxt(d) + ')').join(', ') + '.', days: worked, people: [p.id] });
    }
  }

  // best-effort rules
  // how much of the week-off allowance on reduced-strength days was used
  const fillDays = new Set();
  const fillRules = rules.filter(x => x.type === 'min_days' && x.params.fill);
  fillRules.forEach(x => (x.params.days || []).forEach(w => fillDays.add(w)));
  const extraOn = fillRules.some(x => x.params.extra);
  if (fillDays.size) {
    const parts = [];
    let unused = 0;
    for (const team of TEAMS) {
      const C = out.req[team], arr = out.day[team];
      if (!C || !arr) continue;
      let slots = 0, used = 0, n = 0;
      for (let d = 0; d < D; d++) {
        if (!C.fill[d] || arr[d].isHol || arr[d].locked) continue;
        n++;
        const sl = Math.max(0, arr[d].work + arr[d].off - arr[d].req);
        slots += sl; used += Math.min(arr[d].off, sl);
      }
      if (n) { parts.push(team + ' ' + used + ' of ' + slots); unused += slots - used; }
    }
    if (parts.length) {
      const names = DOW_ORDER.filter(w => fillDays.has(w)).map(w => DOW_SHORT[w]);
      out.notes.unshift({ text: joinWords(names) + ' week-off slots used: ' + parts.join(', ') + '.' + (unused ? ' The other ' + unused + ' would have needed extra week-offs (fewer duty days)' + (isFinite(maxStreak) ? ' or a run longer than ' + maxStreak + ' days' : '') + '.' +
        (extraOn ? '' : ' To fill them, tick “Allow an extra week-off” on the weekend rule.') : '') });
    }
  }
  if (prefOn) {
    let hit = 0, tot = 0;
    const missed = [], blocked = [];
    for (const p of r.people) {
      const st = out.person[p.id];
      if (!st || !p.pref.length) continue;
      const C = out.req[p.team];
      const usable = p.pref.filter(w => { const ds = dows.map((x, i) => (x === w ? i : -1)).filter(i => i >= 0); return !(C && ds.every(i => C.lockedFor(p.id, i))); });
      if (!usable.length) { blocked.push(p); continue; }
      hit += st.prefHit; tot += st.off;
      if (st.prefHit < st.off) missed.push(p);
    }
    if (tot > 0) {
      const pct = Math.round(hit / tot * 100);
      let text = 'Preferred days honoured for ' + hit + ' of ' + tot + ' week-offs (' + pct + '%).';
      if (missed.length) text += ' Partly on other days: ' + missed.slice(0, 6).map(name).join(', ') + (missed.length > 6 ? ' and ' + (missed.length - 6) + ' more' : '') + '.';
      out.notes.push({ text, people: missed.map(p => p.id) });
    }
    if (blocked.length) out.notes.push({ text: 'Preferred day falls only on full-strength days, so it can’t be given: ' + blocked.map(p => name(p) + ' (' + p.pref.map(w => DOW_SHORT[w]).join(', ') + ')').join(', ') + '.', people: blocked.map(p => p.id) });
  }
  if (weekendFair > 0) {
    const short = r.people.filter(p => out.person[p.id] && out.person[p.id].wk < weekendFair);
    if (short.length) out.notes.push({ text: short.length + ' doctor' + (short.length === 1 ? '' : 's') + ' got fewer than ' + weekendFair + ' weekend off: ' + short.slice(0, 6).map(name).join(', ') + (short.length > 6 ? ' and more' : '') + '.', people: short.map(p => p.id) });
  }
  out.ok = out.errors.length === 0;
  return out;
}

function persist(key) {

}
async function flush(key) {

  P.writing[key] = true;
  P.dirty[key] = false;
  const data = clone(docData(key));
  try {
    await P.db.doc(DOCS[key]).set(data);

  } catch (e) {
    await handleWriteError(e, () => P.db.doc(DOCS[key]).set(data));

  P.writing[key] = false;

}
async function handleWriteError(e, retry) {

    P.readOnly = true; setSync('readonly'); render();
    toast('You have view access here, so changes stay on this device.');
  } else if (code === 'quota_exceeded') {
    toast('Team storage is full. Delete some saved rosters in History.');
  } else if (code === 'unavailable' && retry) {
    await new Promise(r => setTimeout(r, 600 + Math.random() * 900));
    try { await retry(); return; } catch (e2) { setSync('error'); }

    setSync('error');
  }

function subscribe() {
  for (const key in DOCS) {
    P.db.doc(DOCS[key]).onSnapshot(snap => {
      if (P.dirty[key] || P.writing[key] || snap.metadata.hasPendingWrites || !snap.exists) return;
      const data = snap.data();
      if (JSON.stringify(data) === JSON.stringify(docData(key))) return;
      applyDoc(key, clone(data));
      lsSet(key, docData(key));
      render();
    }, () => { /* terminal errors: keep working locally */ });
  }
  P.db.collection('rosters').onSnapshot(qs => {
    const next = {};
    for (const d of qs.docs) {
      const data = d.data();
      if (data && data.month && data.codes) next[d.id] = clone(data);
    }
    S.saved = next;
    lsSet('rosters', S.saved);

  }, () => {});
}

function generateBest(month, seed) {
  const input = { month, resources: S.resources, rules: S.rules, holidays: S.holidays, leaves: S.leaves, saved: S.saved };
  let best = null, bestV = null, tries = 0;
  for (let k = 0; k < 6; k++) {
    const r = generateRoster(Object.assign({}, input, { seed: seed + k }));
    tries++;
    const v = validateRoster(r);
    if (!best || v.errors.length < bestV.errors.length) { best = r; bestV = v; }

  best.inputsKey = inputsKey(month);
  best.savedAt = null; best.edited = false; best.dirty = true;
  best.shift = clone(S.shift);
  return best;
}

async function saveFile(filename, data, mime) {
  const dl = P.downloads ? await P.downloads : null;
  if (dl) {
    try {
      const res = await dl.save({ filename, data });
      return res && res.status === 'saved' ? 'saved' : 'delivered';
    } catch (e) {
      const code = e && e.code;
      if (code === 'declined') return 'declined';
      if (code === 'rate_limited') return 'busy';
    }
  }
  if (P.hosted) return 'fallback';
  try {
    const url = URL.createObjectURL(new Blob([data], { type: mime }));
    const a = document.createElement('a');
    a.href = url; a.download = filename; a.style.display = 'none';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 5000);
    return 'saved';
  } catch (e) { return 'fallback'; }
}
